<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Голосовий супровід Claude: прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#142030; --muted:#4E5D70; --line:#D3DAE3;
  --amber:#C27C0E; --teal:#0F7C76; --bad:#B3261E; --btn-bg:#142030; --btn-ink:#FFFFFF; --core-ink:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bad:#FF8A80; --bg:#0F1620; --surface:#18222F; --ink:#EAF0F6; --muted:#9DAABA; --line:#2A3646;
    --amber:#F2B544; --teal:#5CC8C2; --btn-bg:#F2B544; --btn-ink:#0F1620; --core-ink:#0F1620;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bad:#FF8A80; --bg:#0F1620; --surface:#18222F; --ink:#EAF0F6; --muted:#9DAABA; --line:#2A3646;
  --amber:#F2B544; --teal:#5CC8C2; --btn-bg:#F2B544; --btn-ink:#0F1620; --core-ink:#0F1620;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;padding:16px 20px 24px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand-title{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:600;font-size:.95rem;white-space:nowrap}
.brand-sub{color:var(--muted);font-size:.85rem}
.controls{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;font:700 .85rem "Manrope",system-ui,sans-serif;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn .ic-off{display:none}
.icon-btn[aria-pressed="false"] .ic-on{display:none}
.icon-btn[aria-pressed="false"] .ic-off{display:block}

.steps{list-style:none;display:flex;gap:6px;margin:18px 0 0;padding:0}
.steps li{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.steps li.done{background:var(--muted)}
.steps li.current{background:var(--amber)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.orb{width:188px;height:188px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--amber);cursor:default;
  transition:color .4s, opacity .4s;-webkit-tap-highlight-color:transparent}
.orb:not(:disabled){cursor:pointer}
.orb:focus-visible{outline:3px solid var(--teal);outline-offset:6px}
.orb svg{width:100%;height:100%;overflow:visible}
.orb .ring{fill:none;stroke:currentColor;transform-box:view-box;transform-origin:100px 100px}
.orb .r1{stroke-width:2.2;opacity:.8}
.orb .r2{stroke-width:1.6;opacity:.55}
.orb .r3{stroke-width:1.4;opacity:.4;stroke-dasharray:3 9}
.orb .r4{stroke-width:1;opacity:.25}
.orb .core{fill:currentColor}
.orb .bar{fill:var(--core-ink);transform-box:fill-box;transform-origin:center;transform:scaleY(.3)}

.orb[data-state="idle"] .ring{animation:breathe 4.8s ease-in-out infinite}
.orb[data-state="idle"] .r2{animation-delay:.4s}
.orb[data-state="idle"] .r3{animation-delay:.8s}
.orb[data-state="idle"] .r4{animation-delay:1.2s}

.orb[data-state="invite"] .ring{animation:breathe 1.8s ease-in-out infinite}
.orb[data-state="invite"] .r2{animation-delay:.15s}
.orb[data-state="invite"] .r3{animation-delay:.3s}
.orb[data-state="invite"] .r4{animation-delay:.45s}
.orb[data-state="invite"] .bar{transform:scaleY(.55)}

.orb[data-state="listening"]{color:var(--teal)}
.orb[data-state="listening"] .ring{animation:ripple 1.6s ease-out infinite}
.orb[data-state="listening"] .r2{animation-delay:.25s}
.orb[data-state="listening"] .r3{animation-delay:.5s}
.orb[data-state="listening"] .r4{animation-delay:.75s}
.orb[data-state="listening"] .bar{animation:bar 1.1s ease-in-out infinite}

.orb[data-state="thinking"] .r3{animation:spin 1.4s linear infinite;opacity:.9}
.orb[data-state="thinking"] .r1,.orb[data-state="thinking"] .r2{animation:breathe 1.4s ease-in-out infinite}

.orb[data-state="speaking"] .r1{animation:talk .52s ease-in-out infinite}
.orb[data-state="speaking"] .r2{animation:talk .64s ease-in-out infinite}
.orb[data-state="speaking"] .r3{animation:talk .76s ease-in-out infinite}
.orb[data-state="speaking"] .r4{animation:talk .9s ease-in-out infinite}
.orb[data-state="speaking"] .bar{animation:bar .5s ease-in-out infinite}
.orb .b2{animation-delay:.12s!important}.orb .b3{animation-delay:.24s!important}
.orb .b4{animation-delay:.08s!important}.orb .b5{animation-delay:.2s!important}

.orb[data-state="off"]{opacity:.35}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes ripple{0%{transform:scale(.7);opacity:0}30%{opacity:.85}100%{transform:scale(1.18);opacity:0}}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

.caption{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500;font-size:clamp(1.05rem,4.4vw,1.25rem);
  line-height:1.45;margin:22px 0 0;min-height:4.35em;text-wrap:balance;max-width:100%}
.caption.fresh{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.alt{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;margin-top:2px;border:0;border-radius:10px;
  background:transparent;color:var(--muted);font:600 .9rem "Manrope",system-ui,sans-serif;cursor:pointer}
.alt svg{width:16px;height:16px}
.alt[hidden]{display:none}
.hint{color:var(--muted);font-size:.95rem;margin:6px 0 0;min-height:1.5em}
.voice-note{color:var(--muted);font-size:.85rem;margin:6px 0 0;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}
.voice-note[hidden]{display:none}
.link{display:block;margin:4px auto 0;padding:4px 0;border:0;background:none;color:var(--teal);font:700 .85rem "Manrope",system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.panel{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 1rem "Manrope",system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.chip:disabled{cursor:default}
.chip:disabled:not([aria-pressed="true"]){opacity:.5}

.custom{margin-top:18px;text-align:left}
.custom label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:6px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:0 14px;font:500 1rem "Manrope",system-ui,sans-serif}
.row input::placeholder{color:var(--muted);opacity:.8}
.row .btn{padding:0 16px}
.mic{flex:none;width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.mic:disabled{opacity:.5;cursor:default}
.mic-msg{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.mic-msg:empty{display:none}
.mic-live{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;padding:6px 14px;border-radius:999px;border:1px solid var(--teal);background:var(--surface);color:var(--teal);font:700 .88rem "Manrope",system-ui,sans-serif}
.mic-live[hidden]{display:none}
.mic-live .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.btn{min-height:48px;padding:0 22px;border-radius:14px;font:600 1rem "Manrope",system-ui,sans-serif;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.6;cursor:default}
.actions{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.actions .btn{width:100%}

.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible,.row input:focus-visible,.alt:focus-visible,.line:focus-visible,.mic:focus-visible,.script summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.res-head{color:var(--muted);font-size:.9rem;margin:0 0 8px;text-align:left}
.results{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:left}
.results li{padding:14px 18px}
.results li+li{border-top:1px solid var(--line)}
.r-title{font-weight:700}
.r-desc{color:var(--muted);font-size:.95rem;line-height:1.45;margin-top:2px}

.status{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left}
.status h2{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500;font-size:1.05rem;line-height:1.35;margin:0 0 6px}
.status p{color:var(--muted);margin:0}

.script{margin-top:32px;border-top:1px solid var(--line)}
.script summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;font-weight:700}
.script summary::-webkit-details-marker{display:none}
.script summary svg{width:20px;height:20px;transition:transform .2s;flex:none}
.script[open] summary svg{transform:rotate(180deg)}
.script-note{color:var(--muted);font-size:.9rem;margin:0 0 4px}
.script-msg{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.script-msg:empty{display:none}
.group h3{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500;font-size:.88rem;line-height:1.4;margin:20px 0 8px}
.formula{color:var(--muted);font-size:.88rem;margin:-2px 0 8px}
.pause h3{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500;font-size:.88rem;line-height:1.4;margin:16px 0 6px}
.pause-chips{justify-content:flex-start}
.pause-chips .chip{font-size:.95rem;padding:0 16px}
.group ol{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.group li+li{border-top:1px solid var(--line)}
.line{width:100%;display:flex;gap:10px;text-align:left;background:transparent;border:0;color:var(--ink);
  font:500 .95rem "Manrope",system-ui,sans-serif;line-height:1.45;padding:12px 14px;cursor:pointer;border-radius:14px}
.line .num{color:var(--muted);min-width:1.1em;font-variant-numeric:tabular-nums}
.line.playing{color:var(--teal)}
.line.playing .num{color:var(--teal)}

/* fine-tuning step */
.tune{display:flex;flex-direction:column;gap:12px;text-align:left}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.q-title{font-weight:700;margin:0 0 10px}
.q .chips{justify-content:flex-start}
.q-note{color:var(--muted);font-size:.92rem;line-height:1.45;margin:10px 0 0}
.q-btn{margin-top:12px;width:100%}
.q .custom{margin-top:4px}
/* sound & mic check */
.check + .script{margin-top:0}
.check-note{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.check-actions{display:flex;flex-wrap:wrap;gap:8px}
.check-actions .btn{flex:1 1 150px;padding:0 16px}
.check-actions .btn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.check-list{list-style:none;margin:14px 0 4px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.check-list li{display:flex;gap:12px;padding:12px 14px}
.check-list li+li{border-top:1px solid var(--line)}
.ck-dot{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 .78rem/1 "Manrope",system-ui,sans-serif}
.ck-ok .ck-dot{background:var(--teal);color:var(--surface)}
.ck-warn .ck-dot{background:var(--amber);color:var(--surface)}
.ck-bad .ck-dot{background:var(--bad);color:var(--surface)}
.ck-wait .ck-dot,.ck-idle .ck-dot{border:1.5px solid var(--muted);color:var(--muted)}
.ck-label{font-weight:700;font-size:.95rem}
.ck-text{color:var(--muted);font-size:.92rem;line-height:1.45;margin-top:2px}
.link:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}

footer{margin-top:auto;padding-top:28px;color:var(--muted);font-size:.8rem;text-align:center;line-height:1.45}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brand-title" id="brandTitle">Голосовий супровід</span>
      <span class="brand-sub" id="brandSub">прототип</span>
    </div>
    <div class="controls">
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Вимкнути звук">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>
      </button>
      <button class="icon-btn" id="langBtn" type="button" aria-label="Switch to English">EN</button>
    </div>
  </header>

  <ol class="steps" id="steps">
    <li><span class="sr"></span></li><li><span class="sr"></span></li><li><span class="sr"></span></li><li><span class="sr"></span></li><li><span class="sr"></span></li>
  </ol>

  <main>
    <div class="stage">
      <button class="orb" id="orb" type="button" data-state="idle" disabled aria-label="Claude">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring r4" cx="100" cy="100" r="94"/>
          <circle class="ring r3" cx="100" cy="100" r="80"/>
          <circle class="ring r2" cx="100" cy="100" r="64"/>
          <circle class="ring r1" cx="100" cy="100" r="49"/>
          <circle class="core" cx="100" cy="100" r="36"/>
          <rect class="bar b1" x="80" y="88" width="5" height="24" rx="2.5"/>
          <rect class="bar b2" x="89" y="84" width="5" height="32" rx="2.5"/>
          <rect class="bar b3" x="98" y="80" width="5" height="40" rx="2.5"/>
          <rect class="bar b4" x="107" y="84" width="5" height="32" rx="2.5"/>
          <rect class="bar b5" x="116" y="88" width="5" height="24" rx="2.5"/>
        </svg>
      </button>
      <p class="caption" id="caption" aria-live="polite"></p>
      <button class="alt" id="altBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        <span id="altLabel">Інша репліка</span>
      </button>
      <p class="hint" id="hint"></p>
      <p class="mic-live" id="micLive" role="status" hidden><span class="dot" aria-hidden="true"></span><span id="micLiveText"></span></p>
      <div class="voice-note" id="voiceNote" hidden><span id="voiceNoteText"></span><button class="link" type="button" id="voiceNoteBtn">Перевірити звук і мікрофон</button></div>
    </div>
    <section class="panel" id="panel"></section>

    <details class="script check" id="check">
      <summary><span id="checkTitle">Перевірити звук і мікрофон</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <p class="check-note" id="checkNote"></p>
      <div class="check-actions">
        <button class="btn secondary" type="button" id="ckSoundBtn">Перевірити звук</button>
        <button class="btn secondary" type="button" id="ckMicBtn" aria-pressed="false">Перевірити мікрофон</button>
      </div>
      <ul class="check-list" id="checkList"></ul>
      <p class="sr" id="ckLive" aria-live="polite"></p>
    </details>

    <details class="script" id="script">
      <summary><span id="scriptTitle">Усі репліки за етапами</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <p class="script-note" id="scriptNote"></p>
      <p class="script-msg" id="scriptMsg" aria-live="polite"></p>
      <div class="pause" id="pauseBox">
        <h3 id="pauseTitle">Пауза між реченнями</h3>
        <p class="formula" id="pauseNote"></p>
        <div class="chips pause-chips" id="pauseChips"></div>
      </div>
      <div id="scriptBody"></div>
    </details>
  </main>

  <footer id="footer"></footer>
</div>

<script>

var MIC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';

var T = {

    soundOn:"Вимкнути звук", soundOff:"Увімкнути звук",

    wakeHintVoice:function(n){return "Скажіть «"+n+"» або торкніться кола.";},

    tryHint:"Для спроби оберіть тему хобі чи навчання або назвіть свою.",
    tryHintVoice:function(n){return "Скажіть «"+n+"» і запит, наприклад: «"+n+", знайди інформацію про шахи». Або напишіть запит нижче.";},

  return null;
}

var speakToken=0, speakTimer=null, playingNow=false, playToken=0, micActive=false, ttsBroken=false;

function setOrb(s){ orb.setAttribute("data-state", s); }

}
/* speak a line shown in the caption (flow speech) */
function speak(text, done){
  showCaption(text);

  var token=++speakToken;
  clearTimeout(speakTimer);
  setOrb("speaking");
  var finished=false;
  function finish(){
    if(finished || token!==speakToken) return;
    finished=true; clearTimeout(speakTimer);
    setOrb(restState());
    if(done) done();
  }
  var readMs=Math.max(1700, text.length*60);
  if(canSpeak()){
    try{
      var started=false;
      say(text, {
        start:function(){
          started=true;
          if(ttsBroken){ ttsBroken=false; updateVoiceNote(); }
          if(token===speakToken){ clearTimeout(speakTimer); speakTimer=setTimeout(finish, readMs+8000); }
        },
        end:finish,
        error:function(c){ if(c && c!=="interrupted" && c!=="canceled"){ ttsBroken=true; updateVoiceNote(); } finish(); }
      });
      speakTimer=setTimeout(function(){
        if(started || token!==speakToken) return;
        ttsBroken=true; updateVoiceNote();

/* read any written text aloud without changing the caption */
function play(text, onEnd){
  if(!canSpeak()) return false;
  var my=++playToken;

    playingNow=true;
    var ended=false;
    function end(){
      if(ended) return; ended=true;
      if(my===playToken){ playingNow=false; setOrb(restState()); resumeListen(); }
      if(onEnd) onEnd();

    setOrb("speaking");

});

/* ---------- steps ---------- */
function go(step){ clearTimeout(pending); stopMic(); S.step=step; render(); }

function chipsHTML(items, pressedVal){
  return '<div class="chips">'+items.map(function(it){
    return '<button type="button" class="chip" data-v="'+esc(it[0])+'" aria-pressed="'+(pressedVal===it[0]?"true":"false")+'">'+esc(it[1])+'</button>';
  }).join("")+'</div>';
}
function customHTML(id, label, ph, btn){
  var l=L();
  return '<form class="custom" id="'+id+'Form" autocomplete="off"><label for="'+id+'In">'+esc(label)+'</label>'+
    '<div class="row"><input id="'+id+'In" maxlength="40" placeholder="'+esc(ph)+'">'+
    '<button type="button" class="mic" id="'+id+'Mic" aria-pressed="false" aria-label="'+esc(l.micAria)+'">'+MIC_SVG+'</button>'+
    '<button class="btn secondary" type="submit">'+esc(btn)+'</button></div>'+
    '<p class="mic-msg" id="'+id+'Msg" aria-live="polite"></p></form>';
}
function lockPanel(){ var els=panel.querySelectorAll("button,input"); for(var i=0;i<els.length;i++) els[i].disabled=true; }

function render(){
  updateChrome();
  var l=L();
  hint.textContent="";
  panel.innerHTML="";
  stepListen=null; S.micPaused=false;

  if(S.step===0){
    setOrb("idle");
    showLine("intro", []);
    hint.textContent=l.introHint;
    panel.innerHTML='<div class="actions"><button class="btn primary" type="button" id="startBtn">'+esc(l.start)+'</button></div>';
    $("startBtn").onclick=function(){
      this.disabled=true;
      var idx = (S.cur && S.cur.key==="intro") ? S.cur.idx : null;
      speakLine("intro", [], function(){ go(1); }, idx);
    };
    return;
  }

  if(S.step===1){
    var canHear=micUsable();
    panel.innerHTML = chipsHTML(l.names.map(function(n){return [n,n];}), S.name) + customHTML("name", l.customName, l.phName, l.choose);
    function pick(n){
      n=String(n).trim(); if(!n) return;
      stopMic();
      S.name=n;
      var cs=panel.querySelectorAll(".chip");
      for(var i=0;i<cs.length;i++) cs[i].setAttribute("aria-pressed", cs[i].getAttribute("data-v")===n?"true":"false");
      lockPanel();
      hint.textContent="";
      renderScript();
      speakLine("nameOk", [n], function(){ go(2); });
    }
    /* the mic stays on until a word is heard; that word becomes the name straight away */
    function nameListen(){
      if(S.step!==1) return;
      var b=$("nameMic"), input=$("nameIn");
      if(!b || b.disabled) return;
      var ok=listen({btn:b,
        onInterim:function(t){ input.value=t; },
        onFinal:function(alts){ var n=cleanName(alts[0]); if(!n) return false; input.value=n; pick(n); return true; },
        onStop:function(code){ $("nameMsg").textContent=micStopMsg(code); hint.textContent=""; }
      });
      if(ok) hint.textContent=L().nameListening;
    }
    stepListen=nameListen;
    var cs=panel.querySelectorAll(".chip");
    for(var i=0;i<cs.length;i++) cs[i].onclick=function(){ pick(this.getAttribute("data-v")); };
    $("nameForm").onsubmit=function(e){ e.preventDefault(); pick(nameFor($("nameIn").value)); };
    micToggle("name");
    speakLine("askName", [], canHear ? nameListen : null);
    if(canHear) hint.textContent=l.nameHintVoice;
    return;
  }

  if(S.step===2){
    if(S.results){ showResults(); return; }
    var canHear2=micUsable();
    S.awake=false;
    panel.innerHTML = customHTML("req", l.reqLabel, l.phReq, l.find);
    var input=$("reqIn"), msg=$("reqMsg");
    function runRequest(text, heardText){
      var topic=topicFrom(text);
      if(!topic){ msg.textContent=L().reqEmpty; return false; }
      stopMic();
      S.topicKey=topicKeyFor(topic); S.customTopic=S.topicKey ? null : topic;
      S.reqHeard=heardText;
      lockPanel();
      S.thinking=true;
      hideAlt();
      hint.textContent="";
      /* results and the comment wait for both: the simulated search time and the end of the “working” line */
      var timeUp=false, spoken=false;
      function reveal(){
        if(!timeUp || !spoken || !S.thinking) return;
        S.thinking=false; S.results=true; S.comment=rnd(L().lines.comment.length);
        showResults();
      }
      speak(lineText("working", rnd(L().lines.working.length)), function(){ spoken=true; reveal(); });
      pending=setTimeout(function(){ timeUp=true; reveal(); }, 1800);
      return true;
    }
    /* the mic stays on: a phrase with the name is a request; the name alone gets a short reply,
       and then the next phrase is taken as the request */
    function tryListen(){
      if(S.step!==2 || S.thinking || S.results) return;
      var b=$("reqMic"); if(!b || b.disabled) return;
      var ok=listen({btn:b,
        onInterim:function(t){ if(S.awake || heardWake(t)) input.value=t; },
        onFinal:function(alts){
          for(var k=0;k<alts.length;k++){
            var a=alts[k], rest=afterWake(a);
            if(rest===null && !S.awake) continue;
            var req = rest!==null ? rest : a;
            if(topicFrom(req)){ input.value=a; S.viaVoice=true; S.awake=false; runRequest(req, a); return true; }
            if(rest!==null){ S.awake=true; input.value=""; hint.textContent=L().awakeHint; speakLine("listening", [], tryListen); return true; }
          }
          return false;
        },
        onStop:function(code){ msg.textContent=micStopMsg(code); }
      });
      if(ok && !S.awake) hint.textContent=L().tryHintVoice(nm());
    }
    stepListen=tryListen;
    $("reqForm").onsubmit=function(e){
      e.preventDefault();
      var v=input.value.trim(); if(!v) return;
      var rest=afterWake(v);
      if(rest===""){ msg.textContent=L().reqEmpty; return; }
      S.viaVoice=false;
      runRequest(rest ? rest : v, v);
    };
    micToggle("req");
    speakLine("wakePrompt", [nm()], canHear2 ? tryListen : null);
    hint.textContent = canHear2 ? l.tryHintVoice(nm()) : l.tryHintText;
    return;
  }

  if(S.step===3){
    speakLine("tune", [nm()]);
    hint.textContent=l.tuneHint;
    renderTune();
    return;
  }

  if(S.step===4){
    speakLine("decide", []);
    hint.textContent=l.decideHint;
    panel.innerHTML='<div class="actions"><button class="btn primary" type="button" id="keepBtn">'+esc(l.keep)+'</button>'+
      '<button class="btn secondary" type="button" id="offBtn">'+esc(l.off)+'</button></div>';
    $("keepBtn").onclick=function(){ S.decision=true; go(5); };
    $("offBtn").onclick=function(){ S.decision=false; go(5); };
    return;
  }

  if(S.step===5){
    var on = S.decision===true;
    if(on) speakLine("doneOn", [nm()]);
    else speakLine("doneOff", []);
    panel.innerHTML='<div class="status"><h2>'+esc(on?l.onTitle:l.offTitle)+'</h2><p>'+esc(on?l.onText(nm()):l.offText)+'</p></div>'+
      '<div class="actions"><button class="btn secondary" type="button" id="againBtn">'+esc(l.again)+'</button></div>';
    $("againBtn").onclick=function(){
      stopVoice();
      S.name=null; S.topicKey=null; S.customTopic=null; S.results=false; S.thinking=false; S.decision=null;
      S.viaVoice=false; S.awake=false; S.reqHeard=""; S.tuneName=null; S.tuneHeard=null;
      go(0);
    };
  }
}

function topicLabel(){
  var l=L();
  if(S.customTopic) return S.customTopic;
  for(var i=0;i<l.topics.length;i++) if(l.topics[i][0]===S.topicKey) return l.topics[i][1];
  return "";
}
function showResults(){
  var l=L();
  var items = S.customTopic ? l.customResults(S.customTopic) : l.results[S.topicKey];
  panel.innerHTML='<p class="res-head">'+esc(S.reqHeard ? l.heard(S.reqHeard) : l.foundFor(topicLabel()))+'</p><ul class="results">'+
    items.map(function(r){return '<li><div class="r-title">'+esc(r[0])+'</div><div class="r-desc">'+esc(r[1])+'</div></li>';}).join("")+
    '</ul><div class="actions"><button class="btn primary" type="button" id="nextBtn">'+esc(l.next)+'</button>'+
    '<button class="btn secondary" type="button" id="readBtn" aria-pressed="false">'+esc(l.readAloud)+'</button>'+
    '<button class="btn ghost" type="button" id="otherBtn">'+esc(l.otherTopic)+'</button></div>';
  hint.textContent=l.explain;
  speakLine("comment", [], null, S.comment);
  $("readBtn").onclick=function(){
    var b=this;
    if(b.getAttribute("aria-pressed")==="true"){ stopVoice(); return; }
    var text=items.map(function(r){return r[0]+". "+r[1];}).join(" ");
    var ok=play(text, function(){ b.setAttribute("aria-pressed","false"); b.textContent=L().readAloud; });
    if(ok){ b.setAttribute("aria-pressed","true"); b.textContent=L().readStop; }
    else { hint.textContent = S.sound ? L().noTTS : L().needSound; }
  };
  $("nextBtn").onclick=function(){ go(3); };
  $("otherBtn").onclick=function(){ S.results=false; S.topicKey=null; S.customTopic=null; S.reqHeard=""; render(); };
}

/* fine-tuning: is the name right, and did Claude respond to the voice */
function renderTune(){
  var l=L(), n=nm(), h='';
  stepListen=null;
  h+='<div class="tune"><div class="q"><p class="q-title">'+esc(l.tuneNameQ(n))+'</p>';
  if(S.tuneName==="change"){
    h+=customHTML("tname", l.tuneNewName, l.phName, l.save);
  } else {
    h+='<div class="chips"><button type="button" class="chip" data-a="ok" aria-pressed="'+(S.tuneName==="ok"?"true":"false")+'">'+esc(l.tuneYes)+'</button>'+
       '<button type="button" class="chip" data-a="change" aria-pressed="false">'+esc(l.tuneChange)+'</button></div>';
    if(S.tuneName==="changed") h+='<p class="q-note">'+esc(l.tuneChanged(n))+'</p>';
  }
  h+='</div><div class="q"><p class="q-title">'+esc(l.tuneHeardQ)+'</p>';
  if(!S.viaVoice){
    h+='<p class="q-note">'+esc(l.tuneTyped)+'</p>';
  } else {
    h+='<div class="chips"><button type="button" class="chip" data-h="yes" aria-pressed="'+(S.tuneHeard==="yes"?"true":"false")+'">'+esc(l.tuneYes)+'</button>'+
       '<button type="button" class="chip" data-h="no" aria-pressed="'+(S.tuneHeard==="no"?"true":"false")+'">'+esc(l.tuneNo)+'</button></div>';
    if(S.tuneHeard==="no") h+='<p class="q-note">'+esc(l.tuneTip)+'</p>';
  }
  if(!S.viaVoice || S.tuneHeard==="no" || S.tuneName==="changed")
    h+='<button class="btn secondary q-btn" type="button" id="retryBtn">'+esc(S.tuneName==="changed" ? l.tuneRetryNew : l.tuneRetry)+'</button>';
  h+='</div></div><div class="actions"><button class="btn primary" type="button" id="tuneNext">'+esc(l.next)+'</button></div>';
  panel.innerHTML=h;

  var ac=panel.querySelectorAll("[data-a]");
  for(var i=0;i<ac.length;i++) ac[i].onclick=function(){
    var a=this.getAttribute("data-a");
    if(a==="change"){ stopVoice(); speakToken++; }
    S.tuneName=a; renderTune();
  };
  var hc=panel.querySelectorAll("[data-h]");
  for(var j=0;j<hc.length;j++) hc[j].onclick=function(){ S.tuneHeard=this.getAttribute("data-h"); renderTune(); };
  if($("retryBtn")) $("retryBtn").onclick=function(){
    stopMic();
    S.results=false; S.topicKey=null; S.customTopic=null; S.reqHeard=""; S.tuneHeard=null;
    if(S.tuneName==="changed") S.tuneName=null;
    go(2);
  };
  $("tuneNext").onclick=function(){ stopMic(); go(4); };

  if(S.tuneName==="change"){
    var tin=$("tnameIn");
    function save(v){
      var nn=nameFor(v); if(!nn) return;
      stopMic(); S.name=nn; S.tuneName="changed";
      renderScript(); renderTune(); speakLine("nameOk", [nn]);
    }
    $("tnameForm").onsubmit=function(e){ e.preventDefault(); save(tin.value); };
    stepListen=function(){
      if(S.step!==3 || S.tuneName!=="change") return;
      listen({btn:$("tnameMic"),
        onInterim:function(t){ tin.value=t; },
        onFinal:function(alts){ var nn=cleanName(alts[0]); if(!nn) return false; save(nn); return true; },
        onStop:function(code){ $("tnameMsg").textContent=micStopMsg(code); }
      });
    };
    micToggle("tname");
    if(micUsable()) stepListen(); else tin.focus();
  }
}

/* ---------- sound & mic check ---------- */
function srSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function inAppViewer(){
  var ua=navigator.userAgent||"";
  if(/; wv\)/.test(ua) || /Claude/i.test(ua)) return true;
  var ios=/iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  return ios && !/Safari\//.test(ua);
}
function micPolicyBlocked(){
  try{
    var pol=document.permissionsPolicy || document.featurePolicy;
    return !!(pol && pol.allowsFeature && !pol.allowsFeature("microphone"));
  }catch(e){ return false; }
}
/* after a not-allowed error, work out who blocked the mic: the viewer frame, the site setting, an unanswered prompt, or the phone */
function micBlockReason(cb){
  if(micPolicyBlocked()){ cb("policy"); return; }
  try{
    navigator.permissions.query({name:"microphone"}).then(function(p){
      cb(p.state==="denied" ? "site" : p.state==="prompt" ? "ask" : "device");
    }, function(){ cb("denied"); });
  }catch(e){ cb("denied"); }
}
function ckSettle(){ renderCheck(); $("ckLive").textContent=L().ck.micLabel+": "+micState()[1]; }
function soundState(){
  var c=L().ck;
  return {idle:["idle",c.soundIdle], testing:["wait",c.soundTesting], ok:["ok",c.soundOk], fail:["bad",c.soundFail]}[CK.tts];
}
function micState(){
  var c=L().ck;
  if(!srSupported()) return ["bad", c.micNo];
  if(micPolicyBlocked()) return ["bad", c.micPolicy];
  switch(CK.mic){
    case "testing": return ["wait", CK.micHeard ? c.micHearing(CK.micHeard) : c.micTesting];
    case "ok": return ["ok", c.micOk(CK.micHeard)];
    case "denied": return ["bad", c.micDenied];
    case "policy": return ["bad", c.micPolicy];
    case "site": return ["bad", c.micSite];
    case "ask": return ["warn", c.micAsk];
    case "device": return ["bad", c.micDevice];
    case "service": return ["bad", c.micService];
    case "nospeech": return ["warn", c.micNoSpeech];
    case "nodevice": return ["bad", c.micNoDevice];
    case "network": return ["bad", c.micNetwork];
    case "error": return ["bad", c.micError];
    default: return ["idle", c.micIdle];
  }
}
function ckRow(st, label, text){
  var g={ok:"✓", warn:"!", bad:"✕", wait:"…", idle:"·"}[st];
  return '<li class="ck-'+st+'"><span class="ck-dot" aria-hidden="true">'+g+'</span><div><div class="ck-label">'+esc(label)+'</div><div class="ck-text">'+esc(text)+'</div></div></li>';
}
function renderCheck(){
  var c=L().ck, rows=[];
  $("checkTitle").textContent=c.title;
  $("checkNote").textContent=c.note;
  var sb=$("ckSoundBtn"), mb=$("ckMicBtn");
  sb.textContent=c.soundBtn; sb.disabled=!hasTTS || CK.tts==="testing";
  mb.textContent=CK.rec ? c.micStopBtn : c.micBtn; mb.setAttribute("aria-pressed", CK.rec?"true":"false"); mb.disabled=!srSupported();
  if(inAppViewer()) rows.push(ckRow("warn", c.whereLabel, c.whereApp));
  if(!hasTTS) rows.push(ckRow("bad", c.voiceLabel, c.ttsNo));
  else {
    if(!voices.length) rows.push(ckRow("idle", c.voiceLabel, c.voicesUnknown));
    else { var v=pickVoice(), f=fallbackVoice(); rows.push(v ? ckRow("ok", c.voiceLabel, c.voiceYes(v.name)) : ckRow("warn", c.voiceLabel, c.voiceNo(f?f.name:""))); }
    var s=soundState(); rows.push(ckRow(s[0], c.soundLabel, s[1]));
  }
  var m=micState(); rows.push(ckRow(m[0], c.micLabel, m[1]));
  $("checkList").innerHTML=rows.join("");
}
function testSound(){
  if(!hasTTS) return;
  if(!S.sound){ S.sound=true; updateChrome(); }
  var my=++CK.ttsToken, t0=Date.now(), done=false, t=null;
  CK.tts="testing"; renderCheck();
  function set(st){
    if(done || my!==CK.ttsToken) return;
    done=true; clearTimeout(t); CK.tts=st; renderCheck();
    $("ckLive").textContent=L().ck.soundLabel+": "+soundState()[1];
  }
  t=setTimeout(function(){ set("fail"); }, 4000);
  try{
    say(L().ck.sample, {
      start:function(){ set("ok"); },
      end:function(){ set(Date.now()-t0>600 ? "ok" : "fail"); },
      error:function(code){ if(code!=="interrupted" && code!=="canceled") set("fail"); }
    });
  }catch(e){ set("fail"); }
}
function testMic(){
  if(!srSupported()) return;
  if(CK.rec){ try{ CK.rec.stop(); }catch(e){} return; }
  stopMic(); stopVoice();
  var Rec=window.SpeechRecognition || window.webkitSpeechRecognition, r;
  try{ r=new Rec(); }catch(e){ CK.mic="error"; renderCheck(); return; }
  var errored=false;
  CK.rec=r; CK.mic="testing"; CK.micHeard="";
  r.lang=L().ttsLang; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  r.onresult=function(e){
    var txt=""; for(var i=0;i<e.results.length;i++){ txt+=e.results[i][0].transcript; }
    txt=txt.trim(); if(txt){ CK.micHeard=txt; renderCheck(); }
  };
  r.onerror=function(e){
    errored=true;
    var code=e && e.error;
    CK.mic = code==="not-allowed" ? "denied" : code==="service-not-allowed" ? "service" : code==="no-speech" ? "nospeech"
      : code==="audio-capture" ? "nodevice" : code==="network" ? "network" : code==="aborted" ? "idle" : "error";
    if(CK.rec===r) CK.rec=null;
    ckSettle();
    if(code==="not-allowed") micBlockReason(function(why){ if(CK.mic!=="denied") return; CK.mic=why; ckSettle(); });
  };
  r.onend=function(){
    if(CK.rec===r) CK.rec=null;
    if(!errored) CK.mic = CK.micHeard ? "ok" : "nospeech";
    ckSettle();
  };
  try{ r.start(); renderCheck(); }
  catch(e){ CK.rec=null; CK.mic="error"; renderCheck(); }
}
$("ckSoundBtn").addEventListener("click", testSound);
$("ckMicBtn").addEventListener("click", testMic);
$("voiceNoteBtn").addEventListener("click", function(){
  var d=$("check"); d.open=true;
  var calm=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  try{ d.scrollIntoView({behavior: calm ? "auto" : "smooth", block:"start"}); }catch(e){ d.scrollIntoView(); }
  try{ $("ckSoundBtn").focus({preventScroll:true}); }catch(e){}
});

/* ---------- events ---------- */
altBtn.addEventListener("click", function(){
  if(!S.cur) return;
  var len=L().lines[S.cur.key].length;
  var idx=(S.cur.idx+1)%len;
  if(S.cur.key==="comment") S.comment=idx;
  speakLine(S.cur.key, S.cur.args, S.cur.done, idx);
});
/* ---------- understanding what was said ---------- */
function micUsable(){ return !!SR && !micPolicyBlocked(); }
function normWords(s){ return " "+String(s).toLowerCase().replace(/[^a-zа-яіїєґ0-9’']+/g," ").replace(/\s+/g," ").trim()+" "; }
function stemOf(w){ w=normWords(w).trim(); return w.length>5 ? w.slice(0, w.length-2) : w; }
function wakeVariants(){
  var n=nm(), vs=[stemOf(n)];
  if(/claude|клод/i.test(n)) vs=vs.concat(["клод","клауд","клот","claude","claud","cloud","clod"]);
  return vs;
}
/* the words after the name, or null when the name isn't in the phrase */
function afterWake(txt){
  var t=normWords(txt), vs=wakeVariants(), best=-1, end=-1;
  for(var i=0;i<vs.length;i++){
    if(!vs[i]) continue;
    var p=t.indexOf(" "+vs[i]);
    if(p!==-1 && (best===-1 || p<best)){ best=p; var e=t.indexOf(" ", p+1+vs[i].length); end = e===-1 ? t.length : e; }
  }
  return best===-1 ? null : t.slice(end).trim();
}
function heardWake(txt){ return afterWake(txt)!==null; }
/* “знайди мені інфу щодо шахів” → “шахів”: strips the request wording, keeps the topic */
function topicFrom(s){
  var t=normWords(s).trim();
  var lead=/^((будь ласка|ну|а|слухай|так|ok|okay|please|hey) )*(знайди|знайдіть|пошукай|пошукайте|шукай|розкажи|розкажіть|покажи|покажіть|поясни|поясніть|дізнайся|що таке|що за|хто такий|хто така|хто такі|хочу дізнатися|я хочу дізнатися|хочу знати|find|search for|search|look up|tell me|show me|explain|what is|what's|whats|who is|i want to know|i'd like to know)( (мені|нам|me|us))?( (будь ласка|please))?( (інфу|інформацію|інформації|щось|все|усе|дані|статті|матеріали|info|information|something|anything|everything|stuff|more))?( (щодо|стосовно|про|по|на тему|відносно|з приводу|about|on|regarding|for))?( |$)/;
  return t.replace(lead,"").trim();
}
/* a typed or spoken name that matches a ready-made option picks that option; otherwise it becomes the custom name */
function nameFor(v){
  var t=normWords(v), ns=L().names;
  for(var i=0;i<ns.length;i++){ if(t.indexOf(" "+normWords(ns[i]).trim()+" ")!==-1) return ns[i]; }
  var s=String(v).replace(/[.!?…,;:«»"“”]+/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");
  return s ? s.charAt(0).toUpperCase()+s.slice(1) : "";
}
/* “називай мене Кент” → “Кент” */
function cleanName(t){
  var s=normWords(t).trim().replace(/^((будь ласка|давай|хай|нехай|ну|ок|окей|мабуть|ok|okay|well|so|um|uh|let's|lets) )*((називай|називайте|клич|кличте|звертайся|звертайтеся|буде|будеш|ти будеш|тебе звати|твоє ім’я|твоє ім'я|call me|call you|i'll call you|i will call you|your name is|you are|go with)( (мене|тебе|до мене|до тебе))?( |$))?/,"").trim();
  if(!s) return "";
  return nameFor(s.split(" ").slice(0,2).join(" "));
}
/* a topic like “гітару” maps to the matching ready-made topic */
function topicKeyFor(v){
  var t=normWords(v), tp=L().topics;
  for(var i=0;i<tp.length;i++){ if(t.indexOf(" "+stemOf(tp[i][1]))!==-1) return tp[i][0]; }
  return null;
}
orb.addEventListener("click", function(){ var b=panel.querySelector(".mic"); if(b && !b.disabled) b.click(); });
$("langBtn").addEventListener("click", function(){
  S.lang = S.lang==="uk" ? "en" : "uk";
  stopVoice(); stopMic(); clearTimeout(pending); speakToken++;
  if(S.thinking){ S.thinking=false; S.results=true; S.comment=rnd(T[S.lang].lines.comment.length); }
  render();
});
$("soundBtn").addEventListener("click", function(){
  S.sound=!S.sound;
  if(!S.sound) stopVoice();
  updateChrome();
});

render();
})();
