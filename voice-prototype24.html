<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Голосовий супровід Claude: прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#142030; --muted:#4E5D70; --line:#D3DAE3;
  --amber:#C27C0E; --teal:#0F7C76; --bad:#B3261E; --btn-bg:#142030; --btn-ink:#FFFFFF; --core-ink:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bad:#FF8A80; --bg:#0F1620; --surface:#18222F; --ink:#EAF0F6; --muted:#9DAABA; --line:#2A3646;
    --amber:#F2B544; --teal:#5CC8C2; --btn-bg:#F2B544; --btn-ink:#0F1620; --core-ink:#0F1620;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bad:#FF8A80; --bg:#0F1620; --surface:#18222F; --ink:#EAF0F6; --muted:#9DAABA; --line:#2A3646;
  --amber:#F2B544; --teal:#5CC8C2; --btn-bg:#F2B544; --btn-ink:#0F1620; --core-ink:#0F1620;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;padding:16px 20px 24px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand-title{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:600;font-size:.95rem;white-space:nowrap}
.brand-sub{color:var(--muted);font-size:.85rem}
.controls{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;font:700 .85rem "Manrope",system-ui,sans-serif;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn .ic-off{display:none}
.icon-btn[aria-pressed="false"] .ic-on{display:none}
.icon-btn[aria-pressed="false"] .ic-off{display:block}

.steps{list-style:none;display:flex;gap:6px;margin:18px 0 0;padding:0}
.steps li{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.steps li.done{background:var(--muted)}
.steps li.current{background:var(--amber)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.orb{width:188px;height:188px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--amber);cursor:default;
  transition:color .4s, opacity .4s;-webkit-tap-highlight-color:transparent}
.orb:not(:disabled){cursor:pointer}
.orb:focus-visible{outline:3px solid var(--teal);outline-offset:6px}
.orb svg{width:100%;height:100%;overflow:visible}
.orb .ring{fill:none;stroke:currentColor;transform-box:view-box;transform-origin:100px 100px}
.orb .r1{stroke-width:2.2;opacity:.8}
.orb .r2{stroke-width:1.6;opacity:.55}
.orb .r3{stroke-width:1.4;opacity:.4;stroke-dasharray:3 9}
.orb .r4{stroke-width:1;opacity:.25}
.orb .core{fill:currentColor}
.orb .bar{fill:var(--core-ink);transform-box:fill-box;transform-origin:center;transform:scaleY(.3)}

.orb[data-state="idle"] .ring{animation:breathe 4.8s ease-in-out infinite}
.orb[data-state="idle"] .r2{animation-delay:.4s}
.orb[data-state="idle"] .r3{animation-delay:.8s}
.orb[data-state="idle"] .r4{animation-delay:1.2s}

.orb[data-state="invite"] .ring{animation:breathe 1.8s ease-in-out infinite}
.orb[data-state="invite"] .r2{animation-delay:.15s}
.orb[data-state="invite"] .r3{animation-delay:.3s}
.orb[data-state="invite"] .r4{animation-delay:.45s}
.orb[data-state="invite"] .bar{transform:scaleY(.55)}

.orb[data-state="listening"]{color:var(--teal)}
.orb[data-state="listening"] .ring{animation:ripple 1.6s ease-out infinite}
.orb[data-state="listening"] .r2{animation-delay:.25s}
.orb[data-state="listening"] .r3{animation-delay:.5s}
.orb[data-state="listening"] .r4{animation-delay:.75s}
.orb[data-state="listening"] .bar{animation:bar 1.1s ease-in-out infinite}

.orb[data-state="thinking"] .r3{animation:spin 1.4s linear infinite;opacity:.9}
.orb[data-state="thinking"] .r1,.orb[data-state="thinking"] .r2{animation:breathe 1.4s ease-in-out infinite}

.orb[data-state="speaking"] .r1{animation:talk .52s ease-in-out infinite}
.orb[data-state="speaking"] .r2{animation:talk .64s ease-in-out infinite}
.orb[data-state="speaking"] .r3{animation:talk .76s ease-in-out infinite}
.orb[data-state="speaking"] .r4{animation:talk .9s ease-in-out infinite}
.orb[data-state="speaking"] .bar{animation:bar .5s ease-in-out infinite}
.orb .b2{animation-delay:.12s!important}.orb .b3{animation-delay:.24s!important}
.orb .b4{animation-delay:.08s!important}.orb .b5{animation-delay:.2s!important}

.orb[data-state="off"]{opacity:.35}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes ripple{0%{transform:scale(.7);opacity:0}30%{opacity:.85}100%{transform:scale(1.18);opacity:0}}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

.caption{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500;font-size:clamp(1.05rem,4.4vw,1.25rem);
  line-height:1.45;margin:22px 0 0;min-height:4.35em;text-wrap:balance;max-width:100%}
.caption.fresh{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.alt{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;margin-top:2px;border:0;border-radius:10px;
  background:transparent;color:var(--muted);font:600 .9rem "Manrope",system-ui,sans-serif;cursor:pointer}
.alt svg{width:16px;height:16px}
.alt[hidden]{display:none}
.hint{color:var(--muted);font-size:.95rem;margin:6px 0 0;min-height:1.5em}
.voice-note{color:var(--muted);font-size:.85rem;margin:6px 0 0;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}
.voice-note[hidden]{display:none}
.link{display:block;margin:4px auto 0;padding:4px 0;border:0;background:none;color:var(--teal);font:700 .85rem "Manrope",system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.panel{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 1rem "Manrope",system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.chip:disabled{cursor:default}
.chip:disabled:not([aria-pressed="true"]){opacity:.5}

.custom{margin-top:18px;text-align:left}
.custom label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:6px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:0 14px;font:500 1rem "Manrope",system-ui,sans-serif}
.row input::placeholder{color:var(--muted);opacity:.8}
.row .btn{padding:0 16px}
.mic{flex:none;width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.mic:disabled{opacity:.5;cursor:default}
.mic-msg{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.mic-msg:empty{display:none}
.mic-live{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;padding:6px 14px;border-radius:999px;border:1px solid var(--teal);background:var(--surface);color:var(--teal);font:700 .88rem "Manrope",system-ui,sans-serif}
.mic-live[hidden]{display:none}
.tap-sound{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;padding:6px 14px;border-radius:999px;border:1px solid var(--amber);background:var(--surface);color:var(--ink);font:700 .88rem "Manrope",system-ui,sans-serif}
.tap-sound[hidden]{display:none}
.pause-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;margin-top:16px;padding:0 24px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem "Manrope",system-ui,sans-serif;cursor:pointer}
.pause-btn.wide{align-self:stretch}
.pause-btn[hidden]{display:none}
.pause-btn svg{width:18px;height:18px}
.pause-btn .ic-play{display:none}
.pause-btn[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.pause-btn[aria-pressed="true"] .ic-pause{display:none}
.pause-btn[aria-pressed="true"] .ic-play{display:block}
.pause-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.mic-live .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.btn{min-height:48px;padding:0 22px;border-radius:14px;font:600 1rem "Manrope",system-ui,sans-serif;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.6;cursor:default}
.actions{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.actions .btn{width:100%}

.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible,.row input:focus-visible,.alt:focus-visible,.line:focus-visible,.mic:focus-visible,.script summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.res-head{color:var(--muted);font-size:.9rem;margin:0 0 8px;text-align:left}
.results{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:left}
.results li{padding:14px 18px}
.results li+li{border-top:1px solid var(--line)}
.r-title{font-weight:700}
.r-desc{color:var(--muted);font-size:.95rem;line-height:1.45;margin-top:2px}

.status{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left}
.status h2{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500;font-size:1.05rem;line-height:1.35;margin:0 0 6px}
.status p{color:var(--muted);margin:0}

.script{margin-top:32px;border-top:1px solid var(--line)}
.script summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;font-weight:700}
.script summary::-webkit-details-marker{display:none}
.script summary svg{width:20px;height:20px;transition:transform .2s;flex:none}
.script[open] summary svg{transform:rotate(180deg)}
.script-note{color:var(--muted);font-size:.9rem;margin:0 0 4px}
.script-msg{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.script-msg:empty{display:none}
.group h3{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500;font-size:.88rem;line-height:1.4;margin:20px 0 8px}
.formula{color:var(--muted);font-size:.88rem;margin:-2px 0 8px}
.pause h3{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:500;font-size:.88rem;line-height:1.4;margin:16px 0 6px}
.pause-chips{justify-content:flex-start}
.pause-chips .chip{font-size:.95rem;padding:0 16px}
.group ol{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.group li+li{border-top:1px solid var(--line)}
.line{width:100%;display:flex;gap:10px;text-align:left;background:transparent;border:0;color:var(--ink);
  font:500 .95rem "Manrope",system-ui,sans-serif;line-height:1.45;padding:12px 14px;cursor:pointer;border-radius:14px}
.line .num{color:var(--muted);min-width:1.1em;font-variant-numeric:tabular-nums}
.line.playing{color:var(--teal)}
.line .tone{margin-left:auto;padding-left:10px;color:var(--muted);font-size:.78rem;font-weight:600;white-space:nowrap}
.line.playing .num{color:var(--teal)}

/* input level during the mic check */
.level{height:8px;margin:14px 0 0;border-radius:99px;background:var(--line);overflow:hidden}
.level[hidden]{display:none}
.level span{display:block;height:100%;width:0;background:var(--teal);transition:width .08s linear}
/* paused: the screen stays as it was, just inactive */
.panel.on-pause{pointer-events:none;opacity:.55;transition:opacity .2s}
/* option switch in the check section */
.opt{display:flex;align-items:flex-start;gap:10px;margin:14px 0 0;font-size:.95rem;line-height:1.4;color:var(--ink);text-align:left;cursor:pointer}
.opt input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--teal)}
/* the owner's own words */
.words-list{list-style:none;margin:0 0 6px;padding:0}
.words-list li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.words-list li:last-child{border-bottom:0}
.words-list .w{color:var(--muted)}
.words-sum{margin:14px 0 0;color:var(--muted);font-size:.95rem}
/* fine-tuning step */
.tune{display:flex;flex-direction:column;gap:12px;text-align:left}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.q-title{font-weight:700;margin:0 0 10px}
.q .chips{justify-content:flex-start}
.q-note{color:var(--muted);font-size:.92rem;line-height:1.45;margin:10px 0 0}
.q-btn{margin-top:12px;width:100%}
.q .custom{margin-top:4px}
/* sound & mic check */
.check + .script{margin-top:0}
.check-note{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.check-actions{display:flex;flex-wrap:wrap;gap:8px}
.check-actions .btn{flex:1 1 150px;padding:0 16px}
.check-actions .btn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.check-list{list-style:none;margin:14px 0 4px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.check-list li{display:flex;gap:12px;padding:12px 14px}
.check-list li+li{border-top:1px solid var(--line)}
.ck-dot{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 .78rem/1 "Manrope",system-ui,sans-serif}
.ck-ok .ck-dot{background:var(--teal);color:var(--surface)}
.ck-warn .ck-dot{background:var(--amber);color:var(--surface)}
.ck-bad .ck-dot{background:var(--bad);color:var(--surface)}
.ck-wait .ck-dot,.ck-idle .ck-dot{border:1.5px solid var(--muted);color:var(--muted)}
.ck-label{font-weight:700;font-size:.95rem}
.ck-text{color:var(--muted);font-size:.92rem;line-height:1.45;margin-top:2px}
.link:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}

footer{margin-top:auto;padding-top:28px;color:var(--muted);font-size:.8rem;text-align:center;line-height:1.45}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brand-title" id="brandTitle">Голосовий супровід</span>
      <span class="brand-sub" id="brandSub">прототип</span>
    </div>
    <div class="controls">
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Вимкнути звук">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>
      </button>
      <button class="icon-btn" id="langBtn" type="button" aria-label="Switch to English">EN</button>
    </div>
  </header>

  <ol class="steps" id="steps">
    <li><span class="sr"></span></li><li><span class="sr"></span></li><li><span class="sr"></span></li><li><span class="sr"></span></li><li><span class="sr"></span></li><li><span class="sr"></span></li>
  </ol>

  <main>
    <div class="stage">
      <button class="orb" id="orb" type="button" data-state="idle" disabled aria-label="Claude">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring r4" cx="100" cy="100" r="94"/>
          <circle class="ring r3" cx="100" cy="100" r="80"/>
          <circle class="ring r2" cx="100" cy="100" r="64"/>
          <circle class="ring r1" cx="100" cy="100" r="49"/>
          <circle class="core" cx="100" cy="100" r="36"/>
          <rect class="bar b1" x="80" y="88" width="5" height="24" rx="2.5"/>
          <rect class="bar b2" x="89" y="84" width="5" height="32" rx="2.5"/>
          <rect class="bar b3" x="98" y="80" width="5" height="40" rx="2.5"/>
          <rect class="bar b4" x="107" y="84" width="5" height="32" rx="2.5"/>
          <rect class="bar b5" x="116" y="88" width="5" height="24" rx="2.5"/>
        </svg>
      </button>
      <p class="caption" id="caption" aria-live="polite"></p>
      <button class="alt" id="altBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        <span id="altLabel">Інша репліка</span>
      </button>
      <p class="hint" id="hint"></p>
      <p class="mic-live" id="micLive" role="status" hidden><span class="dot" aria-hidden="true"></span><span id="micLiveText"></span></p>
      <p class="tap-sound" id="tapSound" hidden></p>
      <button class="pause-btn" id="pauseBtn" type="button" aria-pressed="false">
        <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        <span id="pauseLabel">Пауза</span>
      </button>
      <div class="voice-note" id="voiceNote" hidden><span id="voiceNoteText"></span><button class="link" type="button" id="voiceNoteBtn">Перевірити звук і мікрофон</button></div>
    </div>
    <section class="panel" id="panel"></section>

    <details class="script check" id="check">
      <summary><span id="checkTitle">Перевірити звук і мікрофон</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <p class="check-note" id="checkNote"></p>
      <div class="check-actions">
        <button class="btn secondary" type="button" id="ckSoundBtn">Перевірити звук</button>
        <button class="btn secondary" type="button" id="ckMicBtn" aria-pressed="false">Перевірити мікрофон</button>
      </div>
      <label class="opt"><input type="checkbox" id="bargeToggle"><span id="bargeLabel"></span></label>
      <div class="level" id="ckLevel" hidden aria-hidden="true"><span id="ckLevelBar"></span></div>
      <ul class="check-list" id="checkList"></ul>
      <p class="sr" id="ckLive" aria-live="polite"></p>
    </details>

    <details class="script" id="script">

  speak(L().reask, function(){ if(!lis && stepListen && !S.paused) stepListen(); else resumeListen(); });
}
function speak(text, done, capText){
  showCaption(capText || text);
  playToken++; playingNow=false;
  var token=++speakToken;
  CURSP={text:g(text), cap:capText || text, done:done, token:token, at:0, idx:0, finished:false};
  clearTimeout(speakTimer);
  setOrb("speaking");
  var finished=false;
  function finish(){
    if(finished || token!==speakToken) return;
    finished=true; clearTimeout(speakTimer);
    if(CURSP && CURSP.token===token) CURSP.finished=true;
    bargeStop();
    captureOff();
    setOrb(restState());
    if(done) done();
  }
  var readMs=Math.max(1700, text.length*60);
  function voiced(){
    try{
      var started=false;
      say(text, {
        boundary:function(e){ if(CURSP && CURSP.token===token && e && e.charIndex>=0) CURSP.idx=e.charIndex; },
        start:function(){
          started=true;
          if(CURSP && CURSP.token===token) CURSP.at=Date.now();
          if(token===speakToken) bargeStart(token);
          if(ttsBroken){ ttsBroken=false; updateVoiceNote(); }
          if(token===speakToken){ clearTimeout(speakTimer); speakTimer=setTimeout(finish, readMs+8000); }
        },
        end:finish,
        error:function(c){
          /* if the browser still refuses before any tap, the line stays as text, without a false alarm */
          if(c==="not-allowed" && !voiceAllowed()){ S.skippedVoice=true; if(token===speakToken){ clearTimeout(speakTimer); speakTimer=setTimeout(finish, readMs); } return; }
          if(c && c!=="interrupted" && c!=="canceled"){ ttsBroken=true; updateVoiceNote(); }
          finish();
        }
      });
      speakTimer=setTimeout(function(){
        if(started || token!==speakToken) return;
        if(voiceAllowed()){ ttsBroken=true; updateVoiceNote(); } else S.skippedVoice=true;
        speakTimer=setTimeout(finish, Math.max(0, readMs-2500));
      }, 2500);
      return true;
    }catch(e){ return false; }
  }
  if(canSpeak() && voiceAllowed()){ if(voiced()) return; }
  else if(canSpeak()){
    /* no tap yet: browsers let a page speak while it is using the microphone,
       so the mic (already allowed for this site) stays open for the length of the line */
    stopMic();
    captureOn().then(function(ok){
      if(finished || token!==speakToken) return;
      if(ok && voiced()) return;
      S.skippedVoice=true;
      speakTimer=setTimeout(finish, readMs);
    });
    return;
  }
  speakTimer=setTimeout(finish, readMs);
}
/* read any written text aloud without changing the caption */
function play(text, onEnd){
  if(!canSpeak()) return false;
  var my=++playToken;
  try{
    playingNow=true;
    var ended=false;
    function end(){
      if(ended) return; ended=true;
      captureOff();
      if(my===playToken){ playingNow=false; setOrb(restState()); resumeListen(); }
      if(onEnd) onEnd();
    }
    setOrb("speaking");
    if(voiceAllowed()) say(text, {end:end, error:end});
    else { stopMic(); captureOn().then(function(){ if(my===playToken && !ended) say(text, {end:end, error:end}); }); }
    setTimeout(end, Math.max(2000, text.length*75)+8000);
    return true;
  }catch(e){ playingNow=false; return false; }
}
function speakLine(key, args, done, idx){
  var arr=L().lines[key];
  if(idx==null) idx=pickIdx(key, arr.length);
  S.cur={key:key, args:args||[], done:done||null, idx:idx};
  speak(ownTouch(key, lineText(key, idx, args)), done);
}
function showLine(key, args, idx){
  var arr=L().lines[key];
  if(idx==null) idx=pickIdx(key, arr.length);
  S.cur={key:key, args:args||[], done:null, idx:idx};
  showCaption(lineText(key, idx, args));
}

/* ---------- voice input ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var rec=null;
function micLive(on){
  var el=$("micLive"); if(!el) return;
  $("micLiveText").textContent=L().micLive;
  el.hidden=!on;
}
var lis=null, stepListen=null;
function stopMic(){
  if(typeof bargeStop==="function" && BARGE) bargeStop();   /* never leave the level-watching mic open: it would block listening */
  lis=null;
  if(rec){ var r=rec; rec=null; try{ r.abort(); }catch(e){} }
  micActive=false; micLive(false);
  var ons=document.querySelectorAll(".mic.on");
  for(var i=0;i<ons.length;i++){ ons[i].classList.remove("on"); ons[i].setAttribute("aria-pressed","false"); ons[i].setAttribute("aria-label", L().micAria); }
}
function micUi(o, on){
  micActive=on; micLive(on);
  if(o.btn){ o.btn.classList.toggle("on", on); o.btn.setAttribute("aria-pressed", on?"true":"false"); o.btn.setAttribute("aria-label", on?L().micStop:L().micAria); }
  setOrb(on ? "listening" : restState());
}
function micStopMsg(code){
  var m=L();
  return (code==="not-allowed"||code==="service-not-allowed") ? m.micDenied : code==="network" ? m.micNetwork : code==="audio-capture" ? m.ck.micNoDevice : m.micError;
}
/* listening that stays on for as long as its step is on screen: short single-phrase sessions,
   the same kind that worked before, started again one after another;
   o.onFinal(alternatives) returns true once it has what it needs */
/* what a heard phrase does: commands that work everywhere first, then the screen's own answer */
function handleFinal(o, alts){
  if(o.paused || o.raw){ BARGE.reask=false; return !!o.onFinal(alts); }   /* on pause only “resume”; while teaching words, words are just words */
  var g=globalCommand(alts);
  if(g && o.onInterim) o.onInterim("");
  var r = g==="stop" ? true : g ? false : (CHK.active && !o.chk) ? false : !!o.onFinal(alts);
  if(BARGE.reask){
    BARGE.reask=false; clearTimeout(BARGE.wd);
    if(!g && !r){ bargeReask(); return true; }
  }
  return r;
}
function listen(o){
  stopMic();
  captureOff();
  if(!micUsable() || (S.paused && !o.paused)) return false;
  var step=S.step, fails=0, quick=0, me={o:o};
  lis=me;
  function run(){
    if(lis!==me || S.step!==step) return;
    /* a phrase that cut the assistant off earlier and found no listener yet is answered first */
    if(BARGE.pending){
      var pa=BARGE.pending; BARGE.pending=null;
      if(Date.now()-pa.at<8000 && handleFinal(o, pa.alts)){ if(lis===me){ lis=null; micUi(o,false); } return; }
    }
    var r; try{ r=new SR(); }catch(e){ lis=null; micUi(o,false); if(o.onStop) o.onStop("error"); return; }
    rec=r;
    r.lang=L().ttsLang; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
    var fatal="", done=false, t0=Date.now();
    r.onresult=function(e){
      if(done || lis!==me) return;
      for(var i=e.resultIndex;i<e.results.length && !done;i++){
        var res=e.results[i], alts=[];
        for(var j=0;j<res.length;j++) alts.push(res[j].transcript);
        if(isEcho(alts[0])) continue;   /* the assistant’s own words coming back through the mic */
        if(res.isFinal){ if(handleFinal(o, alts)) done=true; }
        else if(o.onInterim && !CHK.active && !o.paused) o.onInterim(alts[0]);
      }
      if(done && lis===me){ lis=null; if(rec===r) rec=null; try{ r.abort(); }catch(x){} micUi(o,false); }
    };
    r.onerror=function(e){ var c=e && e.error; if(c==="not-allowed"||c==="service-not-allowed"||c==="audio-capture"||c==="network") fatal=c; };
    r.onend=function(){
      if(rec===r) rec=null;
      if(done || lis!==me || S.step!==step) return;
      quick = (Date.now()-t0<1000) ? quick+1 : 0;
      if(fatal || quick>=5){ lis=null; micUi(o,false); if(o.onStop) o.onStop(fatal||"error"); return; }
      setTimeout(run, 250);
    };
    try{ r.start(); micUi(o,true); }
    catch(e){ rec=null; if(++fails>3){ lis=null; micUi(o,false); if(o.onStop) o.onStop("error"); } else setTimeout(run, 400); }
  }
  whenQuiet(run);
  return lis===me;
}
/* voice commands that work on every screen: the sections below, their buttons, sound, language and pause.
   “stop” means the command took over the mic (or left the screen); “keep” means listening goes on */
function sectionOpen(d, open){
  d.open=open;
  if(open){
    var calm=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try{ d.scrollIntoView({behavior: calm?"auto":"smooth", block:"start"}); }catch(e){ d.scrollIntoView(); }
  }
}
function globalCommand(alts){
  for(var k=0;k<alts.length;k++){
    var c=normWords(alts[k]).trim();
    if(!c || c.split(" ").length>7) continue;
    if(/(знайди|пошукай|розкажи|find|search|tell me)/.test(c)) continue;   /* a search request, not a command */
    /* phrases people use to test a mic are treated as a mic check on any screen */
    if(/(ти мене чуєш|мене чути|мене чутно|чуєш мене|ти чуєш|раз два|перевірка зв|тест тест|^тест$|^алло|^ало$|can you hear me|testing testing|^testing$|one two three)/.test(c)){ micHeardDirect(alts[k]); return "stop"; }
    var open=/(відкрий|відкрити|відкрийте|покажи|розгорни|open|show|expand)/.test(c),
        close=/(закрий|закрити|закрийте|сховай|згорни|приховай|close|hide|collapse)/.test(c),
        tab=/(вкладк|tab)/.test(c),
        kwCheck=/(перевірк|звук і мікрофон|звук та мікрофон|sound and mic|check)/.test(c) || (tab && /(перш|(^| )1( |$)|first)/.test(c)),
        kwLines=/(реплік|lines)/.test(c) || (tab && /(друг|(^| )2( |$)|second)/.test(c));
    if(close && (kwCheck || kwLines || /(все|усе|всі|усі|all)/.test(c))){
      if(kwCheck || !kwLines) sectionOpen($("check"), false);
      if(kwLines || !kwCheck) sectionOpen($("script"), false);
      return "keep";
    }
    /* “перевір мікрофон і звук”: both checks, in the order they were named */
    var hasSnd=/(звук|sound)/.test(c), hasMic=/(мікрофон|\bmic\b|microphone)/.test(c), verb=/(перевір|тест|check|test)/.test(c);
    if(hasSnd && hasMic){ if(verb) chkBoth(c); else chkOpen(); return "stop"; }
    if(open && kwCheck){ chkOpen(); return "stop"; }
    if((open && kwLines) || /^(усі|всі) репліки/.test(c) || /репліки за етапами/.test(c)){ sectionOpen($("script"), true); return "keep"; }
    if(/(перевір\S* звук|тест звуку|check (the )?sound|test (the )?sound|sound check)/.test(c)){ CHK.queue=[]; runSoundCheck(); return "stop"; }
    if(/(перевір\S* мікрофон|тест мікрофон|check (the )?mic|test (the )?mic)/.test(c)){ CHK.queue=[]; runMicCheck(); return "stop"; }
    if(/(пауз|розділ|pause between)/.test(c)){
      var v = /(крапка з комою|крапку з комою|semicolon)/.test(c) ? "semi" : /(тире|dash)/.test(c) ? "dash" : /(кома|кому|comma)/.test(c) ? "comma" : /(крапка|крапку|period|dot)/.test(c) ? "dot" : null;
      if(v){ sectionOpen($("script"), true); var chip=$("pauseChips").querySelector('[data-v="'+v+'"]'); if(chip){ chip.click(); return "stop"; } }
    }
    if((isIntent("stop", c) && c.split(" ").length<=3) || /на паузу/.test(c)){ if(!S.paused) $("pauseBtn").click(); return "stop"; }
    if(isIntent("repeat", c) && c.split(" ").length<=4 && S.cur){ var rc=S.cur; speakLine(rc.key, rc.args, rc.done, rc.idx); return "stop"; }
    if(/((вимкни|вимкнути|вимкніть|без) звук|^mute|sound off)/.test(c)){ if(S.sound) $("soundBtn").click(); return "keep"; }
    if(/((увімкни|увімкнути|увімкніть) звук|unmute|sound on)/.test(c)){ if(!S.sound) $("soundBtn").click(); return "keep"; }
    if(/^(англійською|english|in english|українською|ukrainian|in ukrainian)$/.test(c) || /(перейди|переключи|перемкни|switch|change).*(англійськ|english|українськ|ukrainian)/.test(c)){
      var toEn=/(англійськ|english)/.test(c);
      if((toEn && S.lang==="uk") || (!toEn && S.lang==="en")){ $("langBtn").click(); return "stop"; }
      return "keep";
    }
    /* a word or two naming one part of the check, like «мікрофон» or «звук», starts that check */
    if(c.split(" ").length<=2 && hasMic){ CHK.queue=[]; runMicCheck(); return "stop"; }
    if(c.split(" ").length<=2 && /(^| )(звук|звуки|звуку|sound)( |$)/.test(c)){ CHK.queue=[]; runSoundCheck(); return "stop"; }
  }
  return false;
}
/* the mic button (and the circle) pause and resume the current step's listening */
function micToggle(id){
  var b=$(id+"Mic"), msg=$(id+"Msg"); if(!b) return;
  b.onclick=function(){
    if(lis || rec){ stopMic(); S.micPaused=true; msg.textContent=L().micPaused; setOrb(restState()); return; }
    if(!micUsable()){ msg.textContent = SR ? L().micDenied : L().micUnsupported; return; }
    msg.textContent=""; S.micPaused=false;
    stopVoice(); speakToken++;
    if(stepListen) stepListen();
  };
}
function resumeListen(){ if(stepListen && !lis && !rec && !S.paused && !S.micPaused && !S.thinking && micUsable()) stepListen(); }

  $("brandSub").textContent=l.brandSub;
  $("footer").textContent=l.footer;

  var lis=$("steps").children;

  for(var i=0;i<lis.length;i++){
    lis[i].className = (S.step>i) ? "done" : (S.step===i ? "current" : "");
    if(S.step===i) lis[i].setAttribute("aria-current","step"); else lis[i].removeAttribute("aria-current");
    lis[i].firstChild.textContent = l.stepOf(i+1, lis.length) + l.steps[i];

  var early=S.step===0, last=S.step===6;

  $("check").hidden=early; $("script").hidden=!last;

  updateVoiceNote();
  renderScript();
  renderCheck();
  if(!$("tapSound").hidden) $("tapSound").textContent=l.tapSound;
  updatePause();
}

/* ---------- steps ---------- */
function go(step){ clearTimeout(pending); stopMic(); S.step=step; render(); }

function chipsHTML(items, pressedVal){
  return '<div class="chips">'+items.map(function(it){
    return '<button type="button" class="chip" data-v="'+esc(it[0])+'" aria-pressed="'+(pressedVal===it[0]?"true":"false")+'">'+esc(it[1])+'</button>';

function customHTML(id, label, ph, btn){

    '<div class="row"><input id="'+id+'In" maxlength="'+(id==="req"?"120":"40")+'" placeholder="'+esc(ph)+'" enterkeyhint="'+(btn?"go":"done")+'">'+
    '<button type="button" class="mic" id="'+id+'Mic" aria-pressed="false" aria-label="'+esc(l.micAria)+'">'+MIC_SVG+'</button>'+

function lockPanel(){ var els=panel.querySelectorAll("button,input"); for(var i=0;i<els.length;i++) els[i].disabled=true; }

function render(){
  updateChrome();
  var l=L();
  hint.textContent="";
  panel.innerHTML=""; panel.classList.remove("on-pause");
  stepListen=null; S.micPaused=false; S.held=false;
  if(CHK.active){ CHK.active=false; CHK.ask=null; anaStop(); clearTimeout(CK.micTimer); $("check").open=false; }

  if(S.step===0){
    /* no start button: the greeting starts by itself, and the pause button can stop it */
    speakLine("intro", [], function(){ go(1); });
    hint.textContent=l.introHint;
    return;
  }

  if(S.step===1){
    var canHear=micUsable();
    panel.innerHTML = chipsHTML(l.names.map(function(n){return [n,n];}), S.name) + customHTML("name", l.customName, l.phName, null);
    function pick(n){
      n=String(n).trim(); if(!n) return;
      stopMic();
      S.name=n;
      var cs=panel.querySelectorAll(".chip");
      for(var i=0;i<cs.length;i++) cs[i].setAttribute("aria-pressed", cs[i].getAttribute("data-v")===n?"true":"false");
      lockPanel();
      hint.textContent="";
      renderScript();
      speakLine("nameOk", [n], function(){ go(2); });
    }
    /* the mic stays on until a word is heard; that word becomes the name straight away */
    function nameListen(){
      if(S.step!==1) return;
      var b=$("nameMic"), input=$("nameIn");
      if(!b || b.disabled) return;
      var ok=listen({btn:b,
        onInterim:function(t){ input.value=t; },
        onFinal:function(alts){ if(bareIntent(alts[0])) return false; var n=cleanName(alts[0]); if(!n) return false; input.value=n; pick(n); return true; },
        onStop:function(code){ $("nameMsg").textContent=micStopMsg(code); hint.textContent=""; }
      });
      if(ok) hint.textContent=L().nameListening;
    }
    stepListen=nameListen;
    var cs=panel.querySelectorAll(".chip");
    for(var i=0;i<cs.length;i++) cs[i].onclick=function(){ pick(this.getAttribute("data-v")); };
    $("nameForm").onsubmit=function(e){ e.preventDefault(); pick(nameFor($("nameIn").value)); };
    /* no confirm button: a typed name is applied after a short pause in typing (or right away on Enter) */
    var typeTimer=null;
    $("nameIn").addEventListener("input", function(){
      clearTimeout(typeTimer);
      if(lis || rec){ stopMic(); S.micPaused=true; }
      var inp=this;
      typeTimer=setTimeout(function(){ if(S.step===1 && !inp.disabled && inp.value.trim()) pick(nameFor(inp.value)); }, 1800);
    });
    micToggle("name");
    speakLine("askName", [], canHear ? nameListen : null);
    if(canHear) hint.textContent=l.nameHintVoice;
    return;
  }

  if(isTry()){
    if(S.results){ showResults(); return; }
    var canHear2=micUsable();
    S.awake=false;
    panel.innerHTML = customHTML("req", l.reqLabel, l.phReq, null);
    var input=$("reqIn"), msg=$("reqMsg");
    function runRequest(text, heardText){
      var topic=topicFrom(text);
      if(!topic){ msg.textContent=L().reqEmpty; return false; }
      startSearch(topic, heardText);
      return true;
    }
    /* the mic stays on: a phrase with the name is a request; the name alone gets a short reply,
       and then the next phrase is taken as the request */
    function tryListen(){
      if(!isTry() || S.thinking || S.results) return;
      var b=$("reqMic"); if(!b || b.disabled) return;
      var ok=listen({btn:b,
        onInterim:function(t){ input.value=t; },
        onFinal:function(alts){
          /* the name is optional here: with or without it, a phrase is the request; the name alone gets a short reply */
          for(var k=0;k<alts.length;k++){
            var a=alts[k], rest=afterWake(a);
            if(bareIntent(a)) continue;
            if(rest===""){ S.awake=true; input.value=""; hint.textContent=L().awakeHint; speakLine("listening", [], tryListen); return true; }
            var req = rest!==null ? rest : a;
            if(topicFrom(req)){ input.value=a; S.viaVoice=true; S.awake=false; runRequest(req, a); return true; }
          }
          return false;
        },
        onStop:function(code){ msg.textContent=micStopMsg(code); }
      });
      if(ok && !S.awake) hint.textContent=L().tryHintVoice(nm());
    }
    stepListen=tryListen;
    $("reqForm").onsubmit=function(e){
      e.preventDefault();
      var v=input.value.trim(); if(!v) return;
      var rest=afterWake(v);
      if(rest===""){ msg.textContent=L().reqEmpty; return; }
      S.viaVoice=false;
      runRequest(rest ? rest : v, v);
    };
    /* typed requests start on their own once typing pauses and there is a topic to search */
    var reqTimer=null;
    input.addEventListener("input", function(){
      clearTimeout(reqTimer);
      if(lis || rec){ stopMic(); S.micPaused=true; }
      reqTimer=setTimeout(function(){
        if(!isTry() || input.disabled || S.thinking) return;
        var v=input.value.trim(); if(v.length<3) return;
        var rest=afterWake(v); if(rest==="") return;
        var src = rest!==null ? rest : v, t=topicFrom(src);
        if(!t || t.length<2) return;
        S.viaVoice=false; runRequest(src, v);
      }, 2500);
    });
    micToggle("req");
    speakLine(S.step===5 ? "practice" : "wakePrompt", [nm()], canHear2 ? tryListen : null);
    hint.textContent = canHear2 ? l.tryHintVoice(nm()) : l.tryHintText;
    return;
  }

  if(S.step===3){
    S.tuneShow1=false; S.tuneShow2=false; S.tuneHeard=null; S.tuneShowOffer=false; S.wordsChoice=null;
    /* arriving from “Змінити звертання” on the results: ask for the new name first */
    if(S.tuneName==="change"){ tuneAskName(); return; }
    S.tuneName=null;
    tuneAskQ1();
    return;
  }

  if(S.step===4){
    stepListen=decideListen;
    speakLine("decide", [], micUsable() ? decideListen : null);
    hint.textContent=l.decideHint;
    panel.innerHTML='<div class="actions"><button class="btn primary" type="button" id="keepBtn">'+esc(l.keep)+'</button>'+
      '<button class="btn secondary" type="button" id="offBtn">'+esc(l.off)+'</button></div>';
    $("keepBtn").onclick=function(){ S.decision=true; S.results=false; S.topicKey=null; S.customTopic=null; S.reqHeard=""; go(5); };
    $("offBtn").onclick=function(){ S.decision=false; go(6); };
    return;
  }

  if(S.step===6){
    S.tuneStage=null;
    renderDone();
    if(S.decision===true) speakLine("doneOn", [nm()], micUsable() ? doneListen : null);
    else speakLine("doneOff", [], micUsable() ? doneListen : null);
  }
}
/* the last screen: the result, the owner's words (with a way to add or forget them), and starting again */
function renderDone(){
  var l=L(), on=S.decision===true, any=WORDS.yes.length || WORDS.stop.length || WORDS.next.length, teaching=S.tuneStage==="teach";
  var h='<div class="status"><h2>'+esc(on?l.onTitle:l.offTitle)+'</h2><p>'+esc(on?l.onText(nm()):l.offText)+'</p></div>';
  if(any || teaching){
    h+='<div class="q"><p class="q-title">'+esc(l.wordsSum)+'</p>'+wordsListHTML();
    if(teaching) h+=customHTML("tword", l.wordsFor(l.wordsLabel[WORD_KEYS[S.teachIdx]]), l.phWord, null);
    h+='</div>';
  }
  h+='<div class="actions"><button class="btn secondary" type="button" id="againBtn">'+esc(l.again)+'</button>'+
     (teaching ? '' : '<button class="btn ghost" type="button" id="addWordsBtn">'+esc(l.wordsAdd)+'</button>')+
     (any && !teaching ? '<button class="btn ghost" type="button" id="forgetBtn">'+esc(l.wordsForget)+'</button>' : '')+'</div>';
  panel.innerHTML=h;
  $("againBtn").onclick=function(){
    stopVoice();
    S.name=null; S.topicKey=null; S.customTopic=null; S.results=false; S.thinking=false; S.decision=null;
    S.viaVoice=false; S.awake=false; S.reqHeard=""; S.tuneName=null; S.tuneHeard=null; S.tuneStage=null;
    go(0);
  };
  if($("addWordsBtn")) $("addWordsBtn").onclick=function(){ stopMic(); stopVoice(); speakToken++; S.teachIdx=0; S.tuneStage="teach"; tuneTeachNext(); };
  if($("forgetBtn")) $("forgetBtn").onclick=function(){ WORDS={yes:[], stop:[], next:[]}; saveWords(); renderDone(); };
  if(teaching) wireTeach(); else stepListen=doneListen;
}

function topicLabel(){
  var l=L();
  if(S.customTopic) return S.customTopic;
  for(var i=0;i<l.topics.length;i++) if(l.topics[i][0]===S.topicKey) return l.topics[i][1];
  return "";
}
function showResults(){
  var l=L();
  var items = S.customTopic ? l.customResults(S.customTopic) : l.results[S.topicKey];
  panel.innerHTML='<p class="res-head">'+esc(S.reqHeard ? l.heard(S.reqHeard) : l.foundFor(topicLabel()))+'</p><ul class="results">'+
    items.map(function(r){return '<li><div class="r-title">'+esc(r[0])+'</div><div class="r-desc">'+esc(r[1])+'</div></li>';}).join("")+
    '</ul><div class="actions"><button class="btn primary" type="button" id="nextBtn">'+esc(l.next)+'</button>'+
    '<button class="btn secondary" type="button" id="readBtn" aria-pressed="false">'+esc(l.readAloud)+'</button>'+
    '<button class="btn ghost" type="button" id="otherBtn">'+esc(l.otherTopic)+'</button>'+
    (S.step===2 ? '<button class="btn ghost" type="button" id="renameBtn">'+esc(l.renameBtn(nm()))+'</button>' : '')+'</div>';
  hint.textContent=l.explain;
  stepListen=resultsListen;
  speakLine("comment", [], micUsable() ? resultsListen : null, S.comment);
  $("readBtn").onclick=function(){
    var b=this;
    if(b.getAttribute("aria-pressed")==="true"){ stopVoice(); return; }
    var text=items.map(function(r){return r[0]+". "+r[1];}).join(" ");
    var ok=play(text, function(){ b.setAttribute("aria-pressed","false"); b.textContent=L().readAloud; });
    if(ok){ b.setAttribute("aria-pressed","true"); b.textContent=L().readStop; }
    else { hint.textContent = S.sound ? L().noTTS : L().needSound; }
  };
  $("nextBtn").onclick=function(){ go(S.step===5 ? 6 : 3); };
  $("otherBtn").onclick=function(){ S.results=false; S.topicKey=null; S.customTopic=null; S.reqHeard=""; render(); };
  if($("renameBtn")) $("renameBtn").onclick=goRename;
}

/* runs a (simulated) search; results and the comment wait for both the search time and the end of the “working” line */
function startSearch(topic, heardText){
  stopMic();
  S.topicKey=topicKeyFor(topic); S.customTopic=S.topicKey ? null : topic;
  S.reqHeard=heardText; S.results=false;
  lockPanel();
  S.thinking=true;
  hideAlt();
  hint.textContent="";
  var timeUp=false, spoken=false;
  function reveal(){
    if(!timeUp || !spoken || !S.thinking) return;
    S.thinking=false; S.results=true; S.comment=pickIdx("comment", L().lines.comment.length);
    showResults();
  }
  speak(lineText("working", pickIdx("working", L().lines.working.length)), function(){ spoken=true; reveal(); });
  pending=setTimeout(function(){ timeUp=true; reveal(); }, 1800);
}
/* voice commands on the results screen */
var CMD_NEXT={test:function(c){ return isIntent("next", c); }};
var CMD_READ=/(^| )(прочитай|прочитайте|прочитати|прочитаєш|зачитай|зачитати|озвуч|озвучте|read)( |$)/;
var CMD_OTHER=/(^| )(інший запит|інша тема|another request|another topic|something else)( |$)/;
function hasLead(s){ var t=normWords(s).trim(), f=topicFrom(s); return !!f && f!==t; }
var CMD_RENAME_A=/(звертання|ім’я|ім'я|назву|назва|name)/, CMD_RENAME_B=/(змін|помін|інш|нов|change|rename|another|new|different)/;
/* from the results, changing the name opens the fine-tuning step with the name field ready */
function goRename(){ stopMic(); stopVoice(); speakToken++; S.tuneName="change"; go(3); }
function resultsListen(){
  if(!isTry() || !S.results || S.thinking) return;
  var ok=listen({btn:null,
    onFinal:function(alts){
      for(var k=0;k<alts.length;k++){
        var a=alts[k], rest=afterWake(a), cmd = rest!==null ? rest : normWords(a).trim();
        var short = cmd.split(" ").length<=4;
        if(S.step===2 && cmd.split(" ").length<=5 && CMD_RENAME_A.test(cmd) && CMD_RENAME_B.test(cmd)){ goRename(); return true; }
        if(short && (CMD_NEXT.test(cmd) || (YES_RE.test(cmd) && !NO_RE.test(cmd)))){ stopMic(); go(S.step===5 ? 6 : 3); return true; }
        if(short && CMD_READ.test(cmd)){ stopMic(); var rb=$("readBtn"); if(rb && rb.getAttribute("aria-pressed")!=="true") rb.click(); return true; }
        if(short && CMD_OTHER.test(cmd)){ stopMic(); S.results=false; S.topicKey=null; S.customTopic=null; S.reqHeard=""; render(); return true; }
        var topic = rest!==null ? topicFrom(rest) : (hasLead(cmd) ? topicFrom(cmd) : "");
        if(topic){ if(rest!==null) S.viaVoice=true; startSearch(topic, a); return true; }
      }
      return false;
    },
    onStop:function(code){ hint.textContent=micStopMsg(code); }
  });
  if(ok) hint.textContent=L().resultsHint;
}

/* voice answers on the fine-tuning and decision screens: each spoken word presses the matching button */
var YES_RE={test:function(c){ return isIntent("yes", c); }},
    NO_RE={test:function(c){ return isIntent("no", c); }},
    CHANGE_RE=/(змін|помін|change|rename)/,
    RETRY_RE=/(ще раз|спробу|повтор|again|retry|try)/,
    CMD_PAUSE={test:function(c){ return isIntent("stop", c); }},
    ABOUT_NAME=/(звертання|ім’я|ім'я|назв|name)/,
    ABOUT_HEARD=/(відгук|чув|почув|реагув|respond|heard|hear|react)/;
function pressIn(sel){ var e=panel.querySelector(sel); if(e && !e.disabled){ e.click(); return true; } return false; }
function tuneListen(){
  if(S.step!==3 || (S.tuneStage!=="q1" && S.tuneStage!=="q2" && S.tuneStage!=="offer")) return;
  var ok=listen({btn:null,
    onFinal:function(alts){
      for(var k=0;k<alts.length;k++){
        var cmd=normWords(alts[k]).trim();
        if(!cmd || cmd.split(" ").length>7) continue;
        if(CMD_PAUSE.test(cmd)){ $("pauseBtn").click(); return true; }
        var yes=YES_RE.test(cmd) && !/(^| )(ні|no)( |$)/.test(cmd), no=!yes && NO_RE.test(cmd);
        var ea=echoAnswer(cmd); if(ea==="yes" && !no){ yes=true; } else if(ea==="no"){ yes=false; no=true; }
        if(S.tuneStage==="q1"){
          if(CHANGE_RE.test(cmd) || no){ tuneAnswer1(false); return true; }
          if(yes){ tuneAnswer1(true); return true; }
        } else if(S.tuneStage==="offer"){ if(yes || no){ tuneOfferAnswer(yes); return true; } }
        else if(yes || no){ tuneAnswer2(yes); return true; }
      }
      return false;
    },
    onStop:function(code){ hint.textContent=micStopMsg(code); }
  });
  if(ok) hint.textContent = S.tuneStage==="q1" ? L().tuneHintQ1 : L().tuneHintQ2;
}
function doneListen(){
  if(S.step!==6) return;
  var ok=listen({btn:null,
    onFinal:function(alts){
      for(var k=0;k<alts.length;k++){
        var c=normWords(alts[k]).trim();
        if(!c || c.split(" ").length>7) continue;
        if(/(забудь|забути|видали|forget).*(слова|words)/.test(c)){ pressIn("#forgetBtn"); return false; }
        if(/(додай|додати|додамо|нові|add|new).*(слов|words)/.test(c)){ pressIn("#addWordsBtn"); return true; }
        if(/(ще раз|спочатку|знову|заново|пройти|again|restart|start over)/.test(c)){ pressIn("#againBtn"); return true; }
      }
      return false;
    },
    onStop:function(code){ hint.textContent=micStopMsg(code); }
  });
  if(ok) hint.textContent=L().doneHintVoice;
}
function decideListen(){
  if(S.step!==4) return;
  var ok=listen({btn:null,
    onFinal:function(alts){
      for(var k=0;k<alts.length;k++){
        var cmd=normWords(alts[k]).trim();
        if(!cmd || cmd.split(" ").length>7) continue;
        if(CMD_PAUSE.test(cmd)){ $("pauseBtn").click(); return true; }
        if(/(не вимик|не вимкн|don't turn|do not turn)/.test(cmd)){ pressIn("#keepBtn"); return true; }
        if(/(вимкн|вимик|turn (it )?off|switch off|(^| )off( |$))/.test(cmd) || /(^| )(ні|no)( |$)/.test(cmd)){ pressIn("#offBtn"); return true; }
        if(/(залиш|лиши|увімкн|keep|leave)/.test(cmd) || YES_RE.test(cmd)){ pressIn("#keepBtn"); return true; }
        var ea=echoAnswer(cmd);
        if(ea==="yes"){ pressIn("#keepBtn"); return true; }
        if(ea==="no"){ pressIn("#offBtn"); return true; }
      }
      return false;
    },
    onStop:function(code){ hint.textContent=micStopMsg(code); }
  });
  if(ok) hint.textContent=L().decideHintVoice;
}

/* fine-tuning: one question at a time. Each card appears only once its question has been asked,
   and when both are answered the next step follows on its own. */
function tuneAskQ1(){
  S.tuneStage="q1"; hint.textContent=""; renderTune();
  speakLine("tune", [nm()], function(){
    if(S.step!==3 || S.tuneStage!=="q1") return;
    S.tuneShow1=true; renderTune(); resumeListen();
  });
}
function tuneAskQ2(){
  hint.textContent="";
  /* the request was typed: there was no voice to respond to, so that question is skipped */
  if(!S.viaVoice){ S.tuneStage="done"; renderTune(); speak(L().tuneTyped, function(){ if(S.step===3) tuneOfferWords(); }); return; }
  S.tuneStage="q2"; renderTune();
  speakLine("tuneHeard", [nm()], function(){
    if(S.step!==3 || S.tuneStage!=="q2") return;
    S.tuneShow2=true; renderTune(); resumeListen();
  });
}
function tuneAskName(){
  S.tuneStage="change"; S.tuneShow1=true; hint.textContent=""; renderTune();
  speakLine("askName", [], function(){ if(S.step===3 && S.tuneStage==="change") resumeListen(); });
}
function tuneAnswer1(ok){
  if(S.step!==3 || S.tuneStage!=="q1") return;
  stopMic();
  if(ok){ S.tuneName="ok"; tuneAskQ2(); }
  else { stopVoice(); speakToken++; tuneAskName(); }
}
function tuneSaveName(v){
  var nn=nameFor(v); if(!nn || S.tuneStage!=="change") return;
  stopMic(); S.name=nn; S.tuneName="changed"; S.tuneStage="named";
  renderScript(); renderTune();
  speakLine("nameOk", [nn], function(){ if(S.step===3) tuneAskQ2(); });
}
function tuneAnswer2(yes){
  if(S.step!==3 || S.tuneStage!=="q2") return;
  stopMic(); S.tuneHeard = yes ? "yes" : "no"; S.tuneStage="done"; renderTune();
  if(yes){ tuneOfferWords(); return; }
  /* it didn't respond: a tip, then straight back to trying it by voice */
  speak(L().tuneTip+" "+L().tuneRetrySay, function(){
    if(S.step!==3) return;
    S.results=false; S.topicKey=null; S.customTopic=null; S.reqHeard="";
    go(2);
  });
}
/* the owner's own words: Г.А. offers to learn how its owner says “yes”, “stop” and “next” */
var WORD_KEYS=["yes","stop","next"];
function tuneOfferWords(){
  S.tuneStage="offer"; S.tuneShowOffer=false; renderTune();
  speak(L().wordsOffer, function(){ if(S.step!==3 || S.tuneStage!=="offer") return; S.tuneShowOffer=true; renderTune(); resumeListen(); });
}
function tuneOfferAnswer(yes){
  if(S.step!==3 || S.tuneStage!=="offer") return;
  stopMic(); S.wordsChoice = yes ? "yes" : "no";
  if(!yes){ S.tuneStage="done"; renderTune(); speak(L().wordsNo, function(){ if(S.step===3) go(4); }); return; }
  S.teachIdx=0; tuneTeachNext();
}
function wordsHere(){ return S.step===3 || S.step===6; }
function wordsRender(){ if(S.step===6) renderDone(); else renderTune(); }
function tuneTeachNext(){
  if(S.teachIdx>=WORD_KEYS.length){
    S.tuneStage="done"; wordsRender();
    if(S.step===6){ speak(L().wordsAdded, function(){ if(S.step===6) resumeListen(); }); return; }
    speak(L().wordsDone, function(){ if(S.step===3) go(4); }); return;
  }
  S.tuneStage="teach"; wordsRender();
  speak(L().wordsAsk[WORD_KEYS[S.teachIdx]], function(){ if(wordsHere() && S.tuneStage==="teach") resumeListen(); });
}
function tuneTeachSave(v){
  if(!wordsHere() || S.tuneStage!=="teach") return;
  var key=WORD_KEYS[S.teachIdx], w=normWords(v).trim().split(" ").slice(0,3).join(" ");
  if(!w) return;
  stopMic(); S.tuneStage="saving";
  if(/^(пропусти|пропустити|пропускаю|пропустимо|skip)$/.test(w)){ S.teachIdx++; wordsRender(); speak(L().wordsSkip, function(){ if(wordsHere()) tuneTeachNext(); }); return; }
  if(WORDS[key].indexOf(w)===-1){ WORDS[key].unshift(w); WORDS[key]=WORDS[key].slice(0,3); saveWords(); }
  S.teachIdx++; wordsRender();
  speak(L().wordsSaved(w, L().wordsLabel[key]), function(){ if(wordsHere()) tuneTeachNext(); });
}
function wireTeach(){
  var win=$("twordIn"); if(!win) return;
  $("twordForm").onsubmit=function(e){ e.preventDefault(); tuneTeachSave(win.value); };
  stepListen=function(){
    if(!wordsHere() || S.tuneStage!=="teach") return;
    var ok=listen({btn:$("twordMic"), raw:true,
      onInterim:function(t){ win.value=t; },
      onFinal:function(alts){ if(!normWords(alts[0]).trim()) return false; tuneTeachSave(alts[0]); return true; },
      onStop:function(code){ $("twordMsg").textContent=micStopMsg(code); }
    });
    if(ok) hint.textContent=L().wordsHint;
  };
  micToggle("tword");
}
function wordsListHTML(){
  var l=L();
  return '<ul class="words-list">'+WORD_KEYS.map(function(k){ return '<li><span>'+esc(l.wordsLabel[k])+'</span><span class="w">'+esc(WORDS[k].length ? WORDS[k].join(", ") : "—")+'</span></li>'; }).join("")+'</ul>';
}
function renderTune(){
  var l=L(), n=nm(), h='<div class="tune">';
  stepListen = (S.tuneStage==="q1" || S.tuneStage==="q2" || S.tuneStage==="offer") ? tuneListen : null;
  if(S.tuneShow1){
    h+='<div class="q"><p class="q-title">'+esc(l.tuneNameQ(n))+'</p>';
    if(S.tuneStage==="change") h+=customHTML("tname", l.tuneNewName, l.phName, null);
    else {
      var off = S.tuneStage!=="q1" ? ' disabled' : '';
      h+='<div class="chips"><button type="button" class="chip" data-a="ok" aria-pressed="'+(S.tuneName==="ok"?"true":"false")+'"'+off+'>'+esc(l.tuneYes)+'</button>'+
         '<button type="button" class="chip" data-a="change" aria-pressed="false"'+off+'>'+esc(l.tuneChange)+'</button></div>';
      if(S.tuneName==="changed") h+='<p class="q-note">'+esc(l.tuneChanged(n))+'</p>';
    }
    h+='</div>';
  }
  if(S.tuneShow2){
    var off2 = S.tuneStage!=="q2" ? ' disabled' : '';
    h+='<div class="q"><p class="q-title">'+esc(l.tuneHeardQ)+'</p><div class="chips">'+
       '<button type="button" class="chip" data-h="yes" aria-pressed="'+(S.tuneHeard==="yes"?"true":"false")+'"'+off2+'>'+esc(l.tuneYes)+'</button>'+
       '<button type="button" class="chip" data-h="no" aria-pressed="'+(S.tuneHeard==="no"?"true":"false")+'"'+off2+'>'+esc(l.tuneNo)+'</button></div>';
    if(S.tuneHeard==="no") h+='<p class="q-note">'+esc(l.tuneTip)+'</p>';
    h+='</div>';
  }
  if(S.tuneShowOffer){
    var off3 = S.tuneStage!=="offer" ? ' disabled' : '';
    h+='<div class="q"><p class="q-title">'+esc(l.wordsOfferQ)+'</p><div class="chips">'+
       '<button type="button" class="chip" data-o="yes" aria-pressed="'+(S.wordsChoice==="yes"?"true":"false")+'"'+off3+'>'+esc(l.tuneYes)+'</button>'+
       '<button type="button" class="chip" data-o="no" aria-pressed="'+(S.wordsChoice==="no"?"true":"false")+'"'+off3+'>'+esc(l.tuneNo)+'</button></div></div>';
  }
  if(S.tuneStage==="teach" || S.tuneStage==="saving" || (S.wordsChoice==="yes" && S.tuneStage==="done")){
    h+='<div class="q"><p class="q-title">'+esc(l.wordsTitle)+'</p>'+wordsListHTML();
    if(S.tuneStage==="teach") h+=customHTML("tword", l.wordsFor(l.wordsLabel[WORD_KEYS[S.teachIdx]]), l.phWord, null);
    h+='</div>';
  }
  h+='</div>';
  panel.innerHTML=h;
  var oc=panel.querySelectorAll("[data-o]");
  for(var oi=0;oi<oc.length;oi++) oc[oi].onclick=function(){ tuneOfferAnswer(this.getAttribute("data-o")==="yes"); };
  if(S.tuneStage==="teach"){ wireTeach(); return; }

  var ac=panel.querySelectorAll("[data-a]");
  for(var i=0;i<ac.length;i++) ac[i].onclick=function(){ tuneAnswer1(this.getAttribute("data-a")==="ok"); };
  var hc=panel.querySelectorAll("[data-h]");
  for(var j=0;j<hc.length;j++) hc[j].onclick=function(){ tuneAnswer2(this.getAttribute("data-h")==="yes"); };

  if(S.tuneStage==="change"){
    var tin=$("tnameIn");
    $("tnameForm").onsubmit=function(e){ e.preventDefault(); tuneSaveName(tin.value); };
    var tt=null;
    tin.addEventListener("input", function(){
      clearTimeout(tt);
      if(lis || rec){ stopMic(); S.micPaused=true; }
      tt=setTimeout(function(){ if(S.tuneStage==="change" && tin.value.trim()) tuneSaveName(tin.value); }, 1800);
    });
    stepListen=function(){
      if(S.step!==3 || S.tuneStage!=="change") return;
      var ok=listen({btn:$("tnameMic"),
        onInterim:function(t){ tin.value=t; },
        onFinal:function(alts){ var nn=cleanName(alts[0]); if(!nn) return false; tuneSaveName(nn); return true; },
        onStop:function(code){ $("tnameMsg").textContent=micStopMsg(code); }
      });
      if(ok) hint.textContent=L().nameListening;
    };
    micToggle("tname");
    if(!micUsable()) tin.focus();
  }
}

/* ---------- sound & mic check ---------- */
function srSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function inAppViewer(){
  var ua=navigator.userAgent||"";
  if(/; wv\)/.test(ua) || /Claude/i.test(ua)) return true;
  var ios=/iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  return ios && !/Safari\//.test(ua);
}
function micPolicyBlocked(){
  try{
    var pol=document.permissionsPolicy || document.featurePolicy;
    return !!(pol && pol.allowsFeature && !pol.allowsFeature("microphone"));
  }catch(e){ return false; }
}
/* after a not-allowed error, work out who blocked the mic: the viewer frame, the site setting, an unanswered prompt, or the phone */
function micBlockReason(cb){
  if(micPolicyBlocked()){ cb("policy"); return; }
  try{
    navigator.permissions.query({name:"microphone"}).then(function(p){
      cb(p.state==="denied" ? "site" : p.state==="prompt" ? "ask" : "device");
    }, function(){ cb("denied"); });
  }catch(e){ cb("denied"); }
}
function ckSettle(){ renderCheck(); $("ckLive").textContent=L().ck.micLabel+": "+micState()[1]; }
/* a phrase heard for a mic check: show it, confirm it out loud, then carry on with the step */
/* a phrase that only makes sense as a mic test (“ти мене чуєш?”) counts as a successful mic check */
function micHeardDirect(t){
  var heard=String(t).trim(); if(!heard) return false;
  if(!CHK.active) chkStart();
  micSuccess(heard);
  return true;
}
/* after a check the assistant confirms the result out loud, the check section folds away,
   and the flow carries on from the current step */
function afterCheck(text){
  var tok=++CK.afterToken;
  function carryOn(){
    if(tok!==CK.afterToken) return;
    sectionOpen($("check"), false);
    var calm=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try{ window.scrollTo({top:0, behavior: calm?"auto":"smooth"}); }catch(e){ window.scrollTo(0,0); }
    if(S.paused || S.thinking) return;
    if(S.cur && S.step<6){ var c=S.cur; speakLine(c.key, c.args, c.done, c.idx); }
    else resumeListen();
  }
  if(!text || S.paused || S.thinking || !canSpeak()){ carryOn(); return; }
  speak(text, carryOn);
}
function soundState(){
  var c=L().ck;
  return {idle:["idle",c.soundIdle], testing:["wait",c.soundTesting], ok:["ok",c.soundOk], fail:["bad",c.soundFail]}[CK.tts];
}
function micState(){
  var c=L().ck;
  if(!srSupported()) return ["bad", c.micNo];
  if(micPolicyBlocked()) return ["bad", c.micPolicy];
  switch(CK.mic){
    case "testing": return ["wait", CK.micHeard ? c.micHearing(CK.micHeard) : c.micTesting];
    case "ok": return ["ok", CK.micHeard ? c.micOk(CK.micHeard) : c.micOkSound];
    case "denied": return ["bad", c.micDenied];
    case "policy": return ["bad", c.micPolicy];
    case "site": return ["bad", c.micSite];
    case "ask": return ["warn", c.micAsk];
    case "device": return ["bad", c.micDevice];
    case "service": return ["bad", c.micService];
    case "nospeech": return ["warn", c.micNoSpeech];
    case "nodevice": return ["bad", c.micNoDevice];
    case "network": return ["bad", c.micNetwork];
    case "error": return ["bad", c.micError];
    default: return ["idle", c.micIdle];
  }
}
function ckRow(st, label, text){
  var g={ok:"✓", warn:"!", bad:"✕", wait:"…", idle:"·"}[st];
  return '<li class="ck-'+st+'"><span class="ck-dot" aria-hidden="true">'+g+'</span><div><div class="ck-label">'+esc(label)+'</div><div class="ck-text">'+esc(text)+'</div></div></li>';
}
function renderCheck(){
  var c=L().ck, rows=[];
  $("checkTitle").textContent=c.title;
  $("checkNote").textContent=c.note;
  var sb=$("ckSoundBtn"), mb=$("ckMicBtn");
  sb.textContent=c.soundBtn; sb.disabled=!hasTTS || CK.tts==="testing";
  $("bargeLabel").textContent=L().bargeLabel; $("bargeToggle").checked = !BARGE || BARGE.on;   /* BARGE is set up a little later on first load */
  mb.textContent=(CK.mic==="testing") ? c.micStopBtn : c.micBtn; mb.setAttribute("aria-pressed", (CK.mic==="testing")?"true":"false"); mb.disabled=!srSupported();
  if(inAppViewer()) rows.push(ckRow("warn", c.whereLabel, c.whereApp));
  if(!hasTTS) rows.push(ckRow("bad", c.voiceLabel, c.ttsNo));
  else {
    if(!voices.length) rows.push(ckRow("idle", c.voiceLabel, c.voicesUnknown));
    else { var v=pickVoice(), f=fallbackVoice(); rows.push(v ? ckRow("ok", c.voiceLabel, c.voiceYes(v.name)) : ckRow("warn", c.voiceLabel, c.voiceNo(f?f.name:""))); }
    var s=soundState(); rows.push(ckRow(s[0], c.soundLabel, s[1]));
  }
  var m=micState(); rows.push(ckRow(m[0], c.micLabel, m[1]));
  $("checkList").innerHTML=rows.join("");
}
/* ---------- the check session: sound, then mic (or the other way round), then back to the setup ----------
   While it runs, the flow is on hold: the assistant asks the questions, and answers only drive the check. */
var CHK={active:false, soundDone:false, micDone:false, ask:null, queue:[]};
function chkStart(){
  CHK.active=true; CHK.soundDone=false; CHK.micDone=false; CHK.ask=null; CHK.queue=[];
  stopVoice(); speakToken++; stopMic(); clearTimeout(pending);
  sectionOpen($("check"), true);
}
function chkOpen(){
  if(S.thinking) return;
  if(!CHK.active) chkStart();
  CHK.ask="choose";
  speak(L().ck.askWhich, chkListen);
}
function chkListen(){
  if(!CHK.active) return;
  var ck=L().ck;
  hint.textContent = CHK.ask==="choose" ? ck.hintChoose : CHK.ask==="micphrase" ? ck.hintAnything : ck.hintYesNo;
  listen({btn:null, chk:true,
    onFinal:function(alts){ return chkAnswer(alts[0]); },
    onStop:function(code){ $("ckLive").textContent=micStopMsg(code); }
  });
}
function chkAnswer(t){
  var c=normWords(t).trim(); if(!c) return false;
  if(CHK.ask==="micphrase"){ micSuccess(String(t).trim()); return true; }
  if(/(поверт|поверн|назад|go back|^back)/.test(c) && !/(^| )(ні|не|no)( |$)/.test(c)){ chkEnd(); return true; }
  if(CHK.ask==="choose" || CHK.ask==="return"){
    if(/(обидв|both|everything)/.test(c) || /(^| )(все|усе|all)( |$)/.test(c) || (/(звук|sound)/.test(c) && /(мікрофон|mic)/.test(c))){ chkBoth(c); return true; }
    if(/(звук|sound)/.test(c)){ CHK.queue=[]; runSoundCheck(); return true; }
    if(/(мікрофон|mic)/.test(c)){ CHK.queue=[]; runMicCheck(); return true; }
  }
  var yes=YES_RE.test(c) && !/(^| )(ні|no)( |$)/.test(c), no=!yes && NO_RE.test(c);
  var ea=echoAnswer(c); if(ea==="yes" && !no){ yes=true; } else if(ea==="no"){ yes=false; no=true; }
  if(!yes && !no) return false;
  if(CHK.ask==="mic" || CHK.ask==="retryMic"){ if(yes) runMicCheck(); else askReturn(); return true; }
  if(CHK.ask==="sound"){ if(yes) runSoundCheck(); else askReturn(); return true; }
  if(CHK.ask==="return"){ if(yes) chkEnd(); else chkStay(); return true; }
  return false;
}
function askReturn(){ CHK.ask="return"; speak(L().ck.askReturn, chkListen); }
/* both checks; if the phrase names the mic first, the mic goes first */
function chkBoth(c){
  var m=c.search(/(мікрофон|mic)/), s=c.search(/(звук|sound)/);
  var micFirst = m!==-1 && s!==-1 && m<s;
  if(!CHK.active) chkStart();
  CHK.queue=[micFirst ? "sound" : "mic"];
  if(micFirst) runMicCheck(); else runSoundCheck();
}
function chkStay(){ CHK.ask="choose"; speak(L().ck.stayHere, chkListen); }
/* after a check: confirm it; if both were asked for, go on to the other one, otherwise ask about going back */
function chkNext(line){
  var next = (CHK.queue && CHK.queue.length) ? CHK.queue.shift() : null;
  if(next==="mic"){ CHK.ask=null; speak(line+" "+L().ck.nowMic, function(){ if(CHK.active) runMicCheck(); }); return; }
  if(next==="sound"){ CHK.ask=null; speak(line+" "+L().ck.nowSound, function(){ if(CHK.active) runSoundCheck(); }); return; }
  CHK.ask="return";
  speak(line+" "+L().ck.askReturn, chkListen);
}
function chkEnd(){
  if(!CHK.active) return;
  CHK.active=false; CHK.ask=null; anaStop(); clearTimeout(CK.micTimer);
  stopMic(); hint.textContent="";
  sectionOpen($("check"), false);
  var calm=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  try{ window.scrollTo({top:0, behavior: calm?"auto":"smooth"}); }catch(e){ window.scrollTo(0,0); }
  if(S.paused) return;
  if(S.cur && S.step<6){ var c=S.cur; speakLine(c.key, c.args, c.done, c.idx); }
  else resumeListen();
}
function runSoundCheck(){
  if(!hasTTS) return;
  if(!CHK.active) chkStart();
  anaStop(); clearTimeout(CK.micTimer); CHK.ask=null;
  if(!S.sound){ S.sound=true; updateChrome(); }
  stopMic(); stopVoice(); speakToken++;
  var my=++CK.ttsToken, t0=Date.now(), started=false, ended=false, t=null;
  CK.tts="testing"; renderCheck();
  showCaption(L().ck.sample); setOrb("speaking"); hint.textContent="";
  function fin(ok){
    if(ended || my!==CK.ttsToken) return;
    ended=true; clearTimeout(t);
    CK.tts = ok ? "ok" : "fail"; renderCheck();
    $("ckLive").textContent=L().ck.soundLabel+": "+soundState()[1];
    captureOff();
    if(!CHK.active) return;
    if(ok){ CHK.soundDone=true; chkNext(L().ck.saySoundOk); }
    else { CHK.ask="return"; speak(L().ck.saySoundFail+" "+L().ck.askReturn, chkListen); }
  }
  t=setTimeout(function(){ fin(started); }, 7000);
  var run=function(){
    say(L().ck.sample, {
      start:function(){ started=true; },
      end:function(){ fin(started || Date.now()-t0>600); },
      error:function(code){ if(code!=="interrupted" && code!=="canceled") fin(false); }
    });
  };
  try{ if(voiceAllowed()) run(); else captureOn().then(run); }catch(e){ fin(false); }
}
/* mic check: a short pause, \u201cскажіть будь-що\u201d on screen and out loud, then any voice or sound above the room noise counts */
function runMicCheck(){
  if(!CHK.active) chkStart();
  anaStop(); clearTimeout(CK.micTimer); CHK.ask=null;
  stopMic(); stopVoice(); speakToken++;
  CK.mic="testing"; CK.micHeard=""; renderCheck();
  showCaption(L().ck.sayAnything); hint.textContent=L().ck.hintAnything;
  setTimeout(function(){
    if(!CHK.active || CK.mic!=="testing") return;
    speak(L().ck.sayAnything, function(){
      if(!CHK.active || CK.mic!=="testing") return;
      whenQuiet(function(){
        if(!CHK.active || CK.mic!=="testing") return;
        anaListen(function(){ micSuccess(""); }, micNone, function(){
          /* no direct mic access here: fall back to speech recognition, where any phrase counts */
          CHK.ask="micphrase"; chkListen();
          CK.micTimer=setTimeout(function(){ if(CHK.ask==="micphrase") micNone(); }, 10000);
        });
      });
    });
  }, 500);
}
function micSuccess(text){
  anaStop(); clearTimeout(CK.micTimer); stopMic();
  CK.mic="ok"; CK.micHeard=text||""; ckSettle(); CHK.micDone=true;
  chkNext(text ? L().ck.sayMicOk(text) : L().ck.sayMicHeard);
}
function micNone(){
  anaStop(); clearTimeout(CK.micTimer); stopMic();
  CK.mic="nospeech"; ckSettle();
  CHK.ask="retryMic";
  speak(L().ck.sayMicNone, chkListen);
}
/* the input level, straight from the mic: hears any sound, not only words */
var ANA={ctx:null, stream:null, raf:0, timer:0};
function anaStop(){
  try{ cancelAnimationFrame(ANA.raf); }catch(e){}
  clearTimeout(ANA.timer);
  if(ANA.stream){ try{ ANA.stream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){} ANA.stream=null; }
  if(ANA.ctx){ try{ ANA.ctx.close(); }catch(e){} ANA.ctx=null; }
  var lv=$("ckLevel"); if(lv && !lv.hidden){ lv.hidden=true; micLive(false); setOrb(restState()); }
}
function anaListen(onSound, onTimeout, onFail){
  var AC=window.AudioContext || window.webkitAudioContext;
  if(!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || micPolicyBlocked()){ onFail(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(!CHK.active || CK.mic!=="testing"){ stream.getTracks().forEach(function(tr){ tr.stop(); }); return; }
    var ctx; try{ ctx=new AC(); }catch(e){ stream.getTracks().forEach(function(tr){ tr.stop(); }); onFail(); return; }
    try{ ctx.resume(); }catch(e){}
    var an=ctx.createAnalyser(); an.fftSize=1024;
    ctx.createMediaStreamSource(stream).connect(an);
    ANA.ctx=ctx; ANA.stream=stream;
    var buf=new Float32Array(an.fftSize), t0=performance.now(), last=t0, base=0, n=0, hot=0;
    $("ckLevel").hidden=false; micLive(true); setOrb("listening");
    function tick(now){
      if(!ANA.stream) return;
      an.getFloatTimeDomainData(buf);
      var s=0; for(var i=0;i<buf.length;i++) s+=buf[i]*buf[i];
      var rms=Math.sqrt(s/buf.length);
      $("ckLevelBar").style.width=Math.min(100, Math.round(rms*400))+"%";
      if(now-t0<400){ base+=rms; n++; }
      else {
        var thr=Math.max(0.01, (n ? base/n : 0)*2.5);
        hot = rms>thr ? hot+(now-last) : Math.max(0, hot-(now-last));
        if(hot>150){ anaStop(); onSound(); return; }
      }
      last=now;
      ANA.raf=requestAnimationFrame(tick);
    }
    ANA.raf=requestAnimationFrame(tick);
    ANA.timer=setTimeout(function(){ if(!ANA.stream) return; anaStop(); onTimeout(); }, 10000);
  }, function(){ onFail(); });
}
/* the buttons in the section: the same check, started by tap; tapping the mic button again cancels */
function testSound(){ CHK.queue=[]; runSoundCheck(); }
function testMic(){
  if(CK.mic==="testing" && CHK.active){ anaStop(); clearTimeout(CK.micTimer); CK.mic="idle"; ckSettle(); askReturn(); return; }
  CHK.queue=[];
  runMicCheck();
}
/* opening the section by tap starts a check; closing it goes back to the setup */
$("bargeToggle").addEventListener("change", function(){
  BARGE.on=this.checked; if(!BARGE.on) bargeStop();
  try{ localStorage.setItem("voiceProtoBarge2", BARGE.on ? "on" : "off"); }catch(e){}
});
$("check").addEventListener("toggle", function(){
  if(this.open && !CHK.active && !S.thinking && !S.paused) chkOpen();
  else if(!this.open && CHK.active) chkEnd();
});
$("ckSoundBtn").addEventListener("click", testSound);
$("ckMicBtn").addEventListener("click", testMic);
$("voiceNoteBtn").addEventListener("click", function(){
  var d=$("check"); d.open=true;
  var calm=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  try{ d.scrollIntoView({behavior: calm ? "auto" : "smooth", block:"start"}); }catch(e){ d.scrollIntoView(); }
  try{ $("ckSoundBtn").focus({preventScroll:true}); }catch(e){}
});

/* ---------- events ---------- */
altBtn.addEventListener("click", function(){
  if(!S.cur) return;
  var len=L().lines[S.cur.key].length;
  var idx=(S.cur.idx+1)%len;
  if(S.cur.key==="comment") S.comment=idx;
  speakLine(S.cur.key, S.cur.args, S.cur.done, idx);
});
/* ---------- understanding what was said ---------- */
function micUsable(){ return !!SR && !micPolicyBlocked(); }
function normWords(s){ return " "+String(s).toLowerCase().replace(/[^a-zа-яіїєґ0-9’']+/g," ").replace(/\s+/g," ").trim()+" "; }
/* word stem for loose matching: “Оксано” also matches “Оксана”, “Марко” matches “Марка” */
function stemOf(w){ w=normWords(w).trim(); if(w.length>5) return w.slice(0, w.length-2); if(w.length>3 && /[аоеиіуюяєїaeiouy]$/.test(w)) return w.slice(0,-1); return w; }
function wakeVariants(){
  var n=nm(), vs=[stemOf(n)];
  if(/claude|клод/i.test(n)) vs=vs.concat(["клод","клауд","клот","claude","claud","cloud","clod"]);
  return vs;
}
/* the words after the name, or null when the name isn't in the phrase */
function afterWake(txt){
  var t=normWords(txt), vs=wakeVariants(), best=-1, end=-1;
  for(var i=0;i<vs.length;i++){
    if(!vs[i]) continue;
    var p=t.indexOf(" "+vs[i]);
    if(p!==-1 && (best===-1 || p<best)){ best=p; var e=t.indexOf(" ", p+1+vs[i].length); end = e===-1 ? t.length : e; }
  }
  return best===-1 ? null : t.slice(end).trim();
}
function heardWake(txt){ return afterWake(txt)!==null; }
/* “знайди мені інфу щодо шахів” → “шахів”: strips the request wording, keeps the topic */
function topicFrom(s){
  var t=normWords(s).trim();
  var lead=/^((будь ласка|ну|а|слухай|так|ok|okay|please|hey) )*(знайди|знайдіть|пошукай|пошукайте|шукай|розкажи|розкажіть|покажи|покажіть|поясни|поясніть|дізнайся|що таке|що за|хто такий|хто така|хто такі|хочу дізнатися|я хочу дізнатися|хочу знати|find|search for|search|look up|tell me|show me|explain|what is|what's|whats|who is|i want to know|i'd like to know)( (мені|нам|me|us))?( (будь ласка|please))?( (інфу|інформацію|інформації|щось|все|усе|дані|статті|матеріали|info|information|something|anything|everything|stuff|more))?( (щодо|стосовно|про|по|на тему|відносно|з приводу|about|on|regarding|for))?( |$)/;
  return t.replace(lead,"").trim();
}
/* a typed or spoken name that matches a ready-made option picks that option; otherwise it becomes the custom name */
function nameFor(v){
  var t=normWords(v), ns=L().names;
  for(var i=0;i<ns.length;i++){ if(t.indexOf(" "+normWords(ns[i]).trim()+" ")!==-1) return ns[i]; }
  var s=String(v).replace(/[.!?…,;:«»"“”]+/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");
  return s ? s.charAt(0).toUpperCase()+s.slice(1) : "";
}
/* “називай мене Кент” → “Кент” */
function cleanName(t){
  var s=normWords(t).trim().replace(/^((будь ласка|давай|хай|нехай|ну|ок|окей|мабуть|ok|okay|well|so|um|uh|let's|lets) )*((називай|називайте|клич|кличте|звертайся|звертайтеся|буде|будеш|ти будеш|тебе звати|твоє ім’я|твоє ім'я|call me|call you|i'll call you|i will call you|your name is|you are|go with)( (мене|тебе|до мене|до тебе))?( |$))?/,"").trim();
  if(!s) return "";
  return nameFor(s.split(" ").slice(0,2).join(" "));
}
/* a topic like “гітару” maps to the matching ready-made topic */
function topicKeyFor(v){
  var t=normWords(v), tp=L().topics;
  for(var i=0;i<tp.length;i++){ if(t.indexOf(" "+stemOf(tp[i][1]))!==-1) return tp[i][0]; }
  return null;
}
orb.addEventListener("click", function(){
  /* tapping the circle while the assistant talks interrupts it: it stops at once and listens */
  if(CURSP && !CURSP.finished && CURSP.token===speakToken && S.step>=1 && !S.paused && micUsable()){ bargeCut(speakToken); return; }
  var b=panel.querySelector(".mic");
  if(b && !b.disabled){ b.click(); return; }
  /* screens without a mic button (the results) pause and resume listening from the circle */
  if(!stepListen || S.paused) return;
  if(lis || rec){ stopMic(); S.micPaused=true; setOrb(restState()); }
  else { S.micPaused=false; stopVoice(); speakToken++; stepListen(); }
});
$("langBtn").addEventListener("click", function(){
  S.lang = S.lang==="uk" ? "en" : "uk";
  S.paused=false;
  stopVoice(); stopMic(); clearTimeout(pending); speakToken++;
  if(S.thinking){ S.thinking=false; S.results=true; S.comment=pickIdx("comment", T[S.lang].lines.comment.length); }
  render();
});
/* on pause the mic listens only for “resume” (or the owner's own “next” or “yes” words) */
function pauseListen(){
  if(!S.paused || !micUsable()) return;
  listen({btn:null, paused:true,
    onFinal:function(alts){
      var c=normWords(alts[0]).trim();
      if(isIntent("next", c) || isIntent("yes", c) || /(продовж|давай|поїхали|вперед|resume|continue|go)/.test(c)){ if(S.paused) $("pauseBtn").click(); return true; }
      return false;
    }
  });
}
/* pause: stops the voice, the mic and the automatic steps; resume picks the current step up again */
function updatePause(){
  var b=$("pauseBtn"), l=L();
  b.hidden = S.step>=6;
  b.classList.toggle("wide", S.step===0);
  b.setAttribute("aria-pressed", S.paused?"true":"false");
  $("pauseLabel").textContent = S.paused ? l.resume : l.pause;
}
$("pauseBtn").addEventListener("click", function(){
  if(!S.paused){
    S.paused=true;
    /* note where the voice was: the same line continues from the same word after the pause */
    var r=null;
    if(CURSP && !CURSP.finished && CURSP.token===speakToken){
      var t=CURSP.text, pos=CURSP.idx;
      if(!pos && CURSP.at) pos=Math.floor((Date.now()-CURSP.at)/62);   /* no word events: estimate from the time */
      pos=Math.max(0, Math.min(pos, t.length));
      while(pos>0 && !/\s/.test(t.charAt(pos-1))) pos--;
      r={rest:t.slice(pos), cap:CURSP.cap, done:CURSP.done};
    }
    S.pauseResume=r; S.pauseThinking=S.thinking; S.pauseHint=hint.textContent;
    speakToken++; stopVoice(); stopMic(); clearTimeout(pending); clearTimeout(speakTimer);   /* token first, so the cut-off line cannot move the flow on */
    if(S.thinking){ S.thinking=false; S.results=true; S.comment=pickIdx("comment", L().lines.comment.length); }
    bargeStop();
    panel.classList.add("on-pause");
    setOrb("off");
    hint.textContent=L().pausedHint;
    updatePause();
    pauseListen();
  } else {
    S.paused=false;
    stopMic();
    panel.classList.remove("on-pause");
    updatePause();
    if(S.pauseThinking){ S.pauseThinking=false; render(); return; }   /* the search was under way: show its results */
    hint.textContent=S.pauseHint || "";
    var r2=S.pauseResume; S.pauseResume=null;
    setOrb(restState());
    if(r2 && r2.rest.trim()) speak(r2.rest, r2.done, r2.cap);
    else if(r2 && r2.done) r2.done();
    else resumeListen();
  }
});
$("soundBtn").addEventListener("click", function(){
  S.sound=!S.sound;
  if(!S.sound) stopVoice();
  updateChrome();
});

render();
})();
</script>
